<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 490" width="1020" height="490" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="1020" height="490" fill="#FFFFFF"/><text x="20" y="34" font-size="20" fill="#4C5568" text-anchor="start" font-weight="500">Từ Frolvy tới Unity: các bước xử lý FBX (Pebble Turtle 2026-11-12) · sơ đồ quy trình</text><rect x="30" y="100" width="200" height="90" rx="12" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="130.0" y="134" font-size="22" fill="#16223A" text-anchor="middle" font-weight="700">FBX Frolvy</text><text x="130.0" y="162" font-size="18" fill="#4C5568" text-anchor="middle" font-weight="500">ghi cả scene, ASCII</text><rect x="290" y="100" width="200" height="90" rx="12" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="390.0" y="134" font-size="22" fill="#16223A" text-anchor="middle" font-weight="700">Lọc</text><text x="390.0" y="162" font-size="18" fill="#4C5568" text-anchor="middle" font-weight="500">giữ cây root + mesh</text><rect x="550" y="100" width="200" height="90" rx="12" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="650.0" y="134" font-size="22" fill="#16223A" text-anchor="middle" font-weight="700">Finalize</text><text x="650.0" y="162" font-size="18" fill="#4C5568" text-anchor="middle" font-weight="500">đơn vị ×100, tên take</text><rect x="810" y="100" width="200" height="90" rx="12" fill="#2E7D5B22" stroke="#2E7D5B" stroke-width="3"/><text x="910.0" y="134" font-size="22" fill="#16223A" text-anchor="middle" font-weight="700">BindPose</text><text x="910.0" y="162" font-size="18" fill="#4C5568" text-anchor="middle" font-weight="500">thêm cho file Base</text><path d="M235 145 L285 145" stroke="#16223A" stroke-width="3"/><path d="M495 145 L545 145" stroke="#16223A" stroke-width="3"/><path d="M755 145 L805 145" stroke="#16223A" stroke-width="3"/><path d="M910 190 L910 240" stroke="#16223A" stroke-width="3"/><rect x="100" y="240" width="380" height="90" rx="12" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="290.0" y="274" font-size="22" fill="#16223A" text-anchor="middle" font-weight="700">Base = joint + mesh</text><text x="290.0" y="302" font-size="18" fill="#4C5568" text-anchor="middle" font-weight="500">bỏ clip tĩnh (strip anim)</text><rect x="540" y="240" width="440" height="90" rx="12" fill="#C2492E22" stroke="#C2492E" stroke-width="3"/><text x="760.0" y="274" font-size="22" fill="#16223A" text-anchor="middle" font-weight="700">File anim = joint + clip</text><text x="760.0" y="302" font-size="18" fill="#4C5568" text-anchor="middle" font-weight="500">thêm Null "Dummy" cùng cấp</text><path d="M910 190 L760 240 M910 190 L290 240" stroke="#16223A" stroke-width="2" stroke-dasharray="6 5"/><rect x="100" y="380" width="880" height="80" rx="12" fill="#fff" stroke="#2E7D5B" stroke-width="3"/><text x="540.0" y="414" font-size="22" fill="#16223A" text-anchor="middle" font-weight="700">Kiểm bằng Unity chạy nền</text><text x="540.0" y="442" font-size="18" fill="#4C5568" text-anchor="middle" font-weight="500">bound mesh = bound ở bind pose · log import sạch · đường dẫn joint</text></svg>