<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 302" width="980" height="302" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="980" height="302" fill="#FFFFFF"/><text x="20" y="34" font-size="20" fill="#4C5568" text-anchor="start" font-weight="500">Hero: số cạnh móp ở elbow khi gập 57° (đo chỉ trên phần nhìn thấy, ít hơn = tốt)</text><text x="20" y="90" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Kéo cả bắp tay theo Elbow</text><rect x="440" y="60" width="350" height="22" rx="4" fill="#C2492E"/><text x="798.0" y="78" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">71 cạnh xấu</text><text x="20" y="154" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Trước khi sửa</text><rect x="440" y="124" width="44" height="22" rx="4" fill="#C2492E"/><text x="492.3661971830986" y="142" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">9 cạnh xấu</text><text x="20" y="218" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Chỉ phần đầu nằm trong ống</text><rect x="440" y="188" width="59" height="22" rx="4" fill="#C2492E"/><text x="507.15492957746477" y="206" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">12 cạnh xấu</text><text x="20" y="288" font-size="18" fill="#4C5568" text-anchor="start" font-weight="500">Sửa lần 1 (dải dài) làm móp tay; sửa đúng: chỉ phần nằm trong ống giáp = 100% joint của ống.</text></svg>