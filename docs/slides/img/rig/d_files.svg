<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="920" height="500" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">Hai loại file khi xuất cho game</text><rect x="30" y="70" width="400" height="230" rx="14" fill="#fff" stroke="#F0B13B" stroke-width="3"/><text x="230" y="115" font-size="26" fill="#16223A" text-anchor="middle" font-weight="800">File nhân vật (Base)</text><text x="230" y="165" font-size="24" fill="#16223A" text-anchor="middle" font-weight="600">joint + mesh</text><text x="230" y="205" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">dùng một lần cho mỗi nhân vật</text><text x="230" y="250" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">không có chuyển động</text><rect x="480" y="70" width="400" height="230" rx="14" fill="#fff" stroke="#3B6FB6" stroke-width="3"/><text x="680" y="115" font-size="26" fill="#16223A" text-anchor="middle" font-weight="800">File chuyển động (anim)</text><text x="680" y="165" font-size="24" fill="#16223A" text-anchor="middle" font-weight="600">chỉ joint + chuyển động</text><text x="680" y="205" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">mỗi chuyển động một file</text><text x="680" y="250" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">không có mesh</text><line x1="230" y1="305" x2="440.29857499854666" y2="357.57464374963666" stroke="#16223A" stroke-width="4"/><path d="M450 360 L436.29320702866033 362.8502326994184 L439.24705688383835 351.0348332787063 Z" fill="#16223A"/><line x1="680" y1="305" x2="529.4568659930487" y2="356.74920231488954" stroke="#16223A" stroke-width="4"/><path d="M520 360 L529.9419916811413 350.14318502699183 L533.9011495450378 361.6607351765091 Z" fill="#16223A"/><rect x="300" y="360" width="300" height="70" rx="14" fill="#E6F2EC" stroke="#2E7D5B" stroke-width="3"/><text x="450" y="404" font-size="26" fill="#16223A" text-anchor="middle" font-weight="800">Unity (game)</text><text x="30" y="470" font-size="22" fill="#C2492E" text-anchor="start" font-weight="700">Chỉ xuất file khi bạn nói "chốt". Vòng sửa và góp ý thì không xuất.</text></svg>