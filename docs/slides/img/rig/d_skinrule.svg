<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="940" height="450" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">Weight (trọng số): mỗi đỉnh mesh nghe lời joint nào, bao nhiêu phần</text><rect x="30" y="70" width="880" height="230" rx="14" fill="#fff" stroke="#8793A8" stroke-width="3"/><text x="60" y="112" font-size="26" fill="#16223A" text-anchor="start" font-weight="700">Đỉnh ở giữa khuỷu: chia cho Vai và Khuỷu</text><rect x="70" y="150" width="130" height="34" fill="#F0B13B"/><rect x="200.0" y="150" width="0.0" height="34" fill="#3B6FB6"/><text x="135" y="214" font-size="20" fill="#16223A" text-anchor="middle" font-weight="700">100% / 0%</text><text x="135" y="246" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">Gần vai</text><rect x="240" y="150" width="130" height="34" fill="#F0B13B"/><rect x="337.5" y="150" width="32.5" height="34" fill="#3B6FB6"/><text x="305" y="214" font-size="20" fill="#16223A" text-anchor="middle" font-weight="700">75% / 25%</text><rect x="410" y="150" width="130" height="34" fill="#F0B13B"/><rect x="475.0" y="150" width="65.0" height="34" fill="#3B6FB6"/><text x="475" y="214" font-size="20" fill="#16223A" text-anchor="middle" font-weight="700">50% / 50%</text><text x="475" y="246" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">Ở khớp</text><rect x="580" y="150" width="130" height="34" fill="#F0B13B"/><rect x="612.5" y="150" width="97.5" height="34" fill="#3B6FB6"/><text x="645" y="214" font-size="20" fill="#16223A" text-anchor="middle" font-weight="700">25% / 75%</text><rect x="750" y="150" width="130" height="34" fill="#F0B13B"/><rect x="750.0" y="150" width="130.0" height="34" fill="#3B6FB6"/><text x="815" y="214" font-size="20" fill="#16223A" text-anchor="middle" font-weight="700">0% / 100%</text><text x="815" y="246" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">Gần khuỷu</text><rect x="70" y="262" width="26" height="18" fill="#F0B13B"/><text x="104" y="278" font-size="19" fill="#16223A" text-anchor="start" font-weight="500">Joint Vai</text><rect x="250" y="262" width="26" height="18" fill="#3B6FB6"/><text x="284" y="278" font-size="19" fill="#16223A" text-anchor="start" font-weight="500">Joint Khuỷu</text><rect x="30" y="320" width="880" height="110" rx="14" fill="#FFF3D6" stroke="#F0B13B" stroke-width="3"/><text x="60" y="362" font-size="24" fill="#16223A" text-anchor="start" font-weight="700">Windy: gậy là mảnh cứng, mỗi đỉnh 100% joint112 (không chia).</text><text x="60" y="400" font-size="24" fill="#16223A" text-anchor="start" font-weight="500">Thân người: mỗi đỉnh chia cho tối đa 4 joint, tổng luôn bằng 100%.</text></svg>