<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="940" height="440" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">Ninja: kunai đi theo tay nhờ joint Weapon</text><rect x="30" y="70" width="880" height="260" rx="14" fill="#fff" stroke="#2E7D5B" stroke-width="3"/><circle cx="160" cy="220" r="16" fill="#F0B13B" stroke="#16223A" stroke-width="3"/><text x="160" y="268" font-size="24" fill="#16223A" text-anchor="middle" font-weight="700">Wrist</text><circle cx="300" cy="220" r="12" fill="#E8B923" stroke="#16223A" stroke-width="3"/><text x="300" y="268" font-size="24" fill="#16223A" text-anchor="middle" font-weight="700">Weapon</text><line x1="176" y1="220" x2="288" y2="220" stroke="#16223A" stroke-width="5"/><path d="M340 220 L520 200 L540 220 L520 240 Z" fill="#6B6F7B" stroke="#16223A" stroke-width="3"/><rect x="300" y="212" width="40" height="16" rx="6" fill="#B9955C" stroke="#16223A" stroke-width="3"/><text x="430" y="180" font-size="24" fill="#16223A" text-anchor="middle" font-weight="700">kunai</text><text x="560" y="150" font-size="24" fill="#16223A" text-anchor="start" font-weight="700">Weapon là joint con của Wrist:</text><text x="560" y="190" font-size="24" fill="#16223A" text-anchor="start" font-weight="500">tay xoay thì kunai xoay theo.</text><text x="560" y="240" font-size="24" fill="#2E7D5B" text-anchor="start" font-weight="700">Kunai bám 100% joint Weapon.</text><text x="30" y="380" font-size="22" fill="#16223A" text-anchor="start" font-weight="500">Kunai là mảnh mesh riêng, không bám vào thân.</text><text x="30" y="412" font-size="21" fill="#4C5568" text-anchor="start" font-weight="500">Khi ném, kunai tách khỏi tay (việc của anim, không phải rig).</text></svg>