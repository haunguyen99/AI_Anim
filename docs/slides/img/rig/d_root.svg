<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 366" width="980" height="366" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="980" height="366" fill="#FFFFFF"/><text x="20" y="34" font-size="20" fill="#4C5568" text-anchor="start" font-weight="500">Joint root có skin: số đỉnh bị root kéo (quét Unity 2026-11-06). Ở London: 277 / 1199 đỉnh = 23% thân</text><text x="20" y="90" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">SDR06 Base (London)</text><rect x="300" y="60" width="490" height="22" rx="4" fill="#C2492E"/><text x="798.0" y="78" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">277 đỉnh</text><text x="20" y="154" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">EN_zom2_map6</text><rect x="300" y="124" width="235" height="22" rx="4" fill="#C2492E"/><text x="543.2707581227437" y="142" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">133 đỉnh</text><text x="20" y="218" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">EN_zom1 / zom2 map2</text><rect x="300" y="188" width="57" height="22" rx="4" fill="#C2492E"/><text x="364.60649819494586" y="206" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">32 đỉnh</text><text x="20" y="282" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">map1 (Rau1)</text><rect x="300" y="252" width="7" height="22" rx="4" fill="#C2492E"/><text x="315.0758122743682" y="270" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">4 đỉnh</text><text x="20" y="352" font-size="18" fill="#4C5568" text-anchor="start" font-weight="500">Root dời thì mọi đỉnh này bị kéo theo, thân méo. Luật: root không skin, hip là Root_M.</text></svg>