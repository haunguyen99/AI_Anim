<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="820" height="430" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">Bẫy texture: Frolvy hiển thị ảnh lật dọc</text><rect x="30" y="80" width="200" height="200" rx="14" fill="#fff" stroke="#2E7D5B" stroke-width="3"/><g transform="translate(130,180) scale(1,1)"><text x="0" y="48" font-size="130" fill="#16223A" text-anchor="middle" font-weight="800">F</text></g><text x="130" y="318" font-size="21" fill="#2E7D5B" text-anchor="middle" font-weight="700">Ảnh gốc</text><text x="130" y="346" font-size="19" fill="#4C5568" text-anchor="middle" font-weight="500">(Unity dùng ảnh này)</text><line x1="245" y1="180" x2="290.0" y2="180.0" stroke="#16223A" stroke-width="4"/><path d="M300 180 L287.39374056706254 186.08951747755722 L287.39374056706254 173.91048252244278 Z" fill="#16223A"/><rect x="310" y="80" width="200" height="200" rx="14" fill="#fff" stroke="#C2492E" stroke-width="3"/><g transform="translate(410,180) scale(1,-1)"><text x="0" y="48" font-size="130" fill="#16223A" text-anchor="middle" font-weight="800">F</text></g><text x="410" y="318" font-size="21" fill="#C2492E" text-anchor="middle" font-weight="700">Nạp thẳng vào Frolvy</text><text x="410" y="346" font-size="19" fill="#4C5568" text-anchor="middle" font-weight="500">hiện bị lật dọc</text><line x1="525" y1="180" x2="570.0" y2="180.0" stroke="#16223A" stroke-width="4"/><path d="M580 180 L567.3937405670625 186.08951747755722 L567.3937405670625 173.91048252244278 Z" fill="#16223A"/><rect x="590" y="80" width="200" height="200" rx="14" fill="#fff" stroke="#4C5568" stroke-width="3"/><g transform="translate(690,180) scale(1,1)"><text x="0" y="48" font-size="130" fill="#16223A" text-anchor="middle" font-weight="800">F</text></g><text x="690" y="318" font-size="21" fill="#4C5568" text-anchor="middle" font-weight="700">Lật ảnh