" text-anchor="start" font-weight="600">Ngón tay không có nút riêng</text><text x="560" y="430" font-size="22" fill="#2E7D5B" text-anchor="start" font-weight="600">Kiểm: bấm từng nút ra đúng control;</text><text x="560" y="460" font-size="22" fill="#2E7D5B" text-anchor="start" font-weight="600">không nút nào đè nhau</text></svg>