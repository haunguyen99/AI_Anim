<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="960" height="470" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">Topology quanh một khớp (ví dụ elbow tay): đạt và chưa đạt</text><rect x="30" y="70" width="430" height="330" rx="14" fill="#fff" stroke="#2E7D5B" stroke-width="3"/><line x1="60" y1="140" x2="430" y2="140" stroke="#8793A8" stroke-width="3"/><line x1="60" y1="176" x2="430" y2="176" stroke="#8793A8" stroke-width="3"/><line x1="60" y1="212" x2="430" y2="212" stroke="#8793A8" stroke-width="3"/><line x1="60" y1="248" x2="430" y2="248" stroke="#8793A8" stroke-width="3"/><line x1="60" y1="284" x2="430" y2="284" stroke="#8793A8" stroke-width="3"/><line x1="60" y1="320" x2="430" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="60" y1="140" x2="60" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="113" y1="140" x2="113" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="166" y1="140" x2="166" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="219" y1="140" x2="219" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="272" y1="140" x2="272" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="325" y1="140" x2="325" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="378" y1="140" x2="378" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="431" y1="140" x2="431" y2="320" stroke="#8793A8" stroke-width="3"/><text x="245" y="100" font-size="26" fill="#2E7D5B" text-anchor="middle" font-weight="800">ĐẠT</text><text x="245" y="375" font-size="20" fill="#16223A" text-anchor="middle" font-weight="500">nhiều vòng ngang quanh khớp, ô vuông đều</text><rect x="500" y="70" width="430" height="330" rx="14" fill="#fff" stroke="#C2492E" stroke-width="3"/><line x1="530" y1="140" x2="900" y2="140" stroke="#8793A8" stroke-width="3"/><line x1="530" y1="320" x2="900" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="530" y1="140" x2="900" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="530" y1="320" x2="900" y2="140" stroke="#8793A8" stroke-width="3"/><line x1="715" y1="140" x2="715" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="530" y1="230" x2="900" y2="230" stroke="#8793A8" stroke-width="3"/><line x1="530" y1="140" x2="530" y2="320" stroke="#8793A8" stroke-width="3"/><line x1="900" y1="140" x2="900" y2="320" stroke="#8793A8" stroke-width="3"/><text x="715" y="100" font-size="26" fill="#C2492E" text-anchor="middle" font-weight="800">CHƯA ĐẠT</text><text x="715" y="375" font-size="20" fill="#16223A" text-anchor="middle" font-weight="500">ít vòng, nhiều tris lộn xộn</text><text x="30" y="440" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Topology ít vòng quanh khớp thì chỗ gập sẽ bị góc cạnh hoặc móp, skin kiểu gì cũng xấu.</text></svg>