<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 480" width="1130" height="480" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="1130" height="480" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">Bắt đầu từ đâu: 4 việc đầu tiên</text><rect x="30" y="80" width="240" height="300" rx="14" fill="#fff" stroke="#F0B13B" stroke-width="3"/><circle cx="70" cy="125" r="26" fill="#F0B13B"/><text x="70" y="135" font-size="30" fill="#16223A" text-anchor="middle" font-weight="800">1</text><text x="150" y="200" font-size="23" fill="#16223A" text-anchor="middle" font-weight="700">Mở Frolvy</text><text x="150" y="250" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">phần mềm làm rig;</text><text x="150" y="280" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">nhân vật hiện ra</text><line x1="275" y1="230" x2="285.0" y2="230.0" stroke="#16223A" stroke-width="4"/><path d="M295 230 L282.39374056706254 236.08951747755722 L282.39374056706254 223.91048252244278 Z" fill="#16223A"/><rect x="300" y="80" width="240" height="300" rx="14" fill="#fff" stroke="#F0B13B" stroke-width="3"/><circle cx="340" cy="125" r="26" fill="#F0B13B"/><text x="340" y="135" font-size="30" fill="#16223A" text-anchor="middle" font-weight="800">2</text><text x="420" y="200" font-size="23" fill="#16223A" text-anchor="middle" font-weight="700">Mở khung chat với AI</text><text x="420" y="250" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">nơi bạn gõ yêu cầu</text><text x="420" y="280" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">và xem AI trả lời</text><line x1="545" y1="230" x2="555.0" y2="230.0" stroke="#16223A" stroke-width="4"/><path d="M565 230 L552.3937405670625 236.08951747755722 L552.3937405670625 223.91048252244278 Z" fill="#16223A"/><rect x="570" y="80" width="240" height="300" rx="14" fill="#fff" stroke="#F0B13B" stroke-width="3"/><circle cx="610" cy="125" r="26" fill="#F0B13B"/><text x="610" y="135" font-size="30" fill="#16223A" text-anchor="middle" font-weight="800">3</text><text x="690" y="200" font-size="23" fill="#16223A" text-anchor="middle" font-weight="700">Đưa file + câu đầu</text><text x="690" y="250" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">nói tên nhân vật,</text><text x="690" y="280" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">file model, yêu cầu</text><line x1="815" y1="230" x2="825.0" y2="230.0" stroke="#16223A" stroke-width="4"/><path d="M835 230 L822.3937405670625 236.08951747755722 L822.3937405670625 223.91048252244278 Z" fill="#16223A"/><rect x="840" y="80" width="240" height="300" rx="14" fill="#fff" stroke="#F0B13B" stroke-width="3"/><circle cx="880" cy="125" r="26" fill="#F0B13B"/><text x="880" y="135" font-size="30" fill="#16223A" text-anchor="middle" font-weight="800">4</text><text x="960" y="200" font-size="23" fill="#16223A" text-anchor="middle" font-weight="700">Xem hình AI gửi</text><text x="960" y="250" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">AI dừng ở mỗi gate,</text><text x="960" y="280" font-size="20" fill="#4C5568" text-anchor="middle" font-weight="500">bạn duyệt hoặc góp ý</text><text x="30" y="425" font-size="22" fill="#16223A" text-anchor="start" font-weight="700">Câu đầu tiên mẫu:</text><text x="30" y="455" font-size="21" fill="#16223A" text-anchor="start" font-weight="600">"Rig nhân vật Ninja trong Frolvy. Dừng ở bước đặt joint, chụp 3 góc gửi mình duyệt."</text></svg>