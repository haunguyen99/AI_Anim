<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="1100" height="470" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">Ai làm gì trong việc rig bằng AI</text><rect x="30" y="70" width="320" height="360" rx="14" fill="#fff" stroke="#F0B13B" stroke-width="3"/><rect x="30" y="70" width="320" height="56" rx="14" fill="#F0B13B"/><text x="190" y="108" font-size="30" fill="#fff" text-anchor="middle" font-weight="800">BẠN</text><text x="50" y="175" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Giao việc: nhân vật, file</text><text x="50" y="239" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Duyệt ở các cổng</text><text x="50" y="303" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Góp ý: khoanh trên hình</text><text x="50" y="367" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Nói "chốt" mới xuất file</text><rect x="380" y="70" width="320" height="360" rx="14" fill="#fff" stroke="#2E7D5B" stroke-width="3"/><rect x="380" y="70" width="320" height="56" rx="14" fill="#2E7D5B"/><text x="540" y="108" font-size="30" fill="#fff" text-anchor="middle" font-weight="800">AI</text><text x="400" y="175" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Làm từng bước theo thứ tự</text><text x="400" y="239" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Báo bằng số + hình</text><text x="400" y="303" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Tự kiểm trước khi gửi bạn</text><text x="400" y="367" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Ghi cái chưa kiểm</text><rect x="730" y="70" width="320" height="360" rx="14" fill="#fff" stroke="#3B6FB6" stroke-width="3"/><rect x="730" y="70" width="320" height="56" rx="14" fill="#3B6FB6"/><text x="890" y="108" font-size="30" fill="#fff" text-anchor="middle" font-weight="800">FROLVY</text><text x="750" y="175" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Phần mềm rigging (như Maya)</text><text x="750" y="239" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Nơi dựng joint, control, skin</text><text x="750" y="303" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• AI điều khiển qua cầu nối</text><text x="750" y="367" font-size="21" fill="#16223A" text-anchor="start" font-weight="500">• Bạn mở ra xem trực tiếp</text><line x1="352" y1="250" x2="368.0" y2="250.0" stroke="#4C5568" stroke-width="4"/><path d="M378 250 L365.39374056706254 256.08951747755725 L365.39374056706254 243.91048252244278 Z" fill="#4C5568"/><line x1="702" y1="250" x2="718.0" y2="250.0" stroke="#4C5568" stroke-width="4"/><path d="M728 250 L715.3937405670625 256.08951747755725 L715.3937405670625 243.91048252244278 Z" fill="#4C5568"/></svg>