<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 302" width="980" height="302" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="980" height="302" fill="#FFFFFF"/><text x="20" y="34" font-size="20" fill="#4C5568" text-anchor="start" font-weight="500">Hero: độ co giãn cạnh topology (1,0 = không biến dạng; càng gần 1 càng tốt). Đỏ = trước, xanh = sau sửa</text><text x="20" y="90" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Sau knee (kéo IK 17 cm)</text><rect x="300" y="60" width="186" height="22" rx="4" fill="#C2492E"/><text x="494.2" y="78" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">×0,38</text><rect x="300" y="86" width="363" height="22" rx="4" fill="#2E7D5B"/><text x="670.6" y="104" font-size="19" fill="#2E7D5B" text-anchor="start" font-weight="700">×0,74</text><text x="20" y="154" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Nếp bẹn trước</text><rect x="300" y="124" width="176" height="22" rx="4" fill="#C2492E"/><text x="484.4" y="142" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">×0,36</text><rect x="300" y="150" width="265" height="22" rx="4" fill="#2E7D5B"/><text x="572.6" y="168" font-size="19" fill="#2E7D5B" text-anchor="start" font-weight="700">×0,54</text><text x="20" y="218" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Sau knee: làm mịn quá tay</text><rect x="300" y="188" width="220" height="22" rx="4" fill="#C2492E"/><text x="528.5" y="206" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">×0,45 trước</text><rect x="300" y="214" width="142" height="22" rx="4" fill="#2E7D5B"/><text x="450.1" y="232" font-size="19" fill="#2E7D5B" text-anchor="start" font-weight="700">×0,29 sau làm mịn: TỆ HƠN</text><text x="20" y="288" font-size="18" fill="#4C5568" text-anchor="start" font-weight="500">Dòng 3 là lỗi ngược: làm mịn 3 lượt mức 0,5 làm sau knee tệ hơn. Hạ 2 lượt × 0,35 và bỏ qua sau knee.</text></svg>