<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 174" width="980" height="174" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="980" height="174" fill="#FFFFFF"/><text x="20" y="34" font-size="20" fill="#4C5568" text-anchor="start" font-weight="500">Hero: số đỉnh scapula chịu ảnh hưởng của Scapula (trên 79 đỉnh). Đỏ = trước, xanh = sau</text><text x="20" y="90" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Đỉnh có weight Scapula</text><rect x="300" y="60" width="124" height="22" rx="4" fill="#C2492E"/><text x="432.0506329113924" y="78" font-size="19" fill="#C2492E" text-anchor="start" font-weight="700">20 đỉnh (TB 4%)</text><rect x="300" y="86" width="329" height="22" rx="4" fill="#2E7D5B"/><text x="636.7341772151899" y="104" font-size="19" fill="#2E7D5B" text-anchor="start" font-weight="700">53 đỉnh (TB 21%)</text><text x="20" y="160" font-size="18" fill="#4C5568" text-anchor="start" font-weight="500">Người dùng: "xoay Scapula thì mesh scapula phải theo mạnh hơn".</text></svg>