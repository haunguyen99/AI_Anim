<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="1100" height="370" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">Rigging nằm ở đâu trong quy trình làm game</text><rect x="30" y="80" width="220" height="200" rx="14" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="140" y="135" font-size="36" fill="#16223A" text-anchor="middle" font-weight="800">Model</text><text x="140" y="185" font-size="19" fill="#16223A" text-anchor="middle" font-weight="500">mesh nhân vật</text><text x="140" y="220" font-size="19" fill="#4C5568" text-anchor="middle" font-weight="500">(chưa cử động được)</text><line x1="255" y1="180" x2="285.0" y2="180.0" stroke="#16223A" stroke-width="4"/><path d="M295 180 L282.39374056706254 186.08951747755722 L282.39374056706254 173.91048252244278 Z" fill="#16223A"/><rect x="300" y="80" width="220" height="200" rx="14" fill="#FFF3D6" stroke="#F0B13B" stroke-width="3"/><text x="410" y="135" font-size="36" fill="#16223A" text-anchor="middle" font-weight="800">Rig</text><text x="410" y="185" font-size="19" fill="#16223A" text-anchor="middle" font-weight="500">joint + control kéo</text><text x="410" y="220" font-size="19" fill="#C2492E" text-anchor="middle" font-weight="700">(việc của slide này)</text><line x1="525" y1="180" x2="555.0" y2="180.0" stroke="#16223A" stroke-width="4"/><path d="M565 180 L552.3937405670625 186.08951747755722 L552.3937405670625 173.91048252244278 Z" fill="#16223A"/><rect x="570" y="80" width="220" height="200" rx="14" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="680" y="135" font-size="36" fill="#16223A" text-anchor="middle" font-weight="800">Anim</text><text x="680" y="185" font-size="19" fill="#16223A" text-anchor="middle" font-weight="500">animator kéo control</text><text x="680" y="220" font-size="19" fill="#4C5568" text-anchor="middle" font-weight="500">tạo chuyển động</text><line x1="795" y1="180" x2="825.0" y2="180.0" stroke="#16223A" stroke-width="4"/><path d="M835 180 L822.3937405670625 186.08951747755722 L822.3937405670625 173.91048252244278 Z" fill="#16223A"/><rect x="840" y="80" width="220" height="200" rx="14" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="950" y="135" font-size="36" fill="#16223A" text-anchor="middle" font-weight="800">Unity</text><text x="950" y="185" font-size="19" fill="#16223A" text-anchor="middle" font-weight="500">file FBX trong game</text><text x="950" y="220" font-size="19" fill="#4C5568" text-anchor="middle" font-weight="500"></text><text x="560" y="330" font-size="24" fill="#16223A" text-anchor="middle" font-weight="600">Không có rig thì animator không có gì để kéo; rig sai thì anim đẹp mấy cũng méo.</text></svg>