<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 500" width="1010" height="500" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="1010" height="500" fill="#FFFFFF"/><text x="20" y="38" font-size="24" fill="#4C5568" text-anchor="start" font-weight="500">IK và FK: hai cách điều khiển cùng một cái tay</text><rect x="20" y="60" width="470" height="420" rx="14" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="255" y="100" font-size="28" fill="#16223A" text-anchor="middle" font-weight="700">FK: xoay từng khớp</text><polyline points="90,300 200,230 310,290" fill="none" stroke="#16223A" stroke-width="8"/><circle cx="90" cy="300" r="13" fill="#F0B13B" stroke="#16223A" stroke-width="3"/><text x="90" y="344" font-size="22" fill="#16223A" text-anchor="middle" font-weight="600">Vai</text><circle cx="200" cy="230" r="13" fill="#F0B13B" stroke="#16223A" stroke-width="3"/><text x="200" y="274" font-size="22" fill="#16223A" text-anchor="middle" font-weight="600">Khuỷu</text><circle cx="310" cy="290" r="13" fill="#F0B13B" stroke="#16223A" stroke-width="3"/><text x="310" y="334" font-size="22" fill="#16223A" text-anchor="middle" font-weight="600">Cổ tay</text><path d="M110 270 A 40 40 0 0 1 150 265" fill="none" stroke="#C2492E" stroke-width="4"/><text x="100" y="246" font-size="20" fill="#C2492E" text-anchor="start" font-weight="700">① xoay</text><path d="M215 255 A 40 40 0 0 1 245 285" fill="none" stroke="#C2492E" stroke-width="4"/><text x="250" y="262" font-size="20" fill="#C2492E" text-anchor="start" font-weight="700">② xoay</text><text x="255" y="400" font-size="22" fill="#4C5568" text-anchor="middle" font-weight="500">Muốn đặt bàn tay ở đâu thì xoay vai,</text><text x="255" y="430" font-size="22" fill="#4C5568" text-anchor="middle" font-weight="500">rồi khuỷu, rồi cổ tay, từng bước.</text><text x="255" y="462" font-size="22" fill="#2E7D5B" text-anchor="middle" font-weight="700">Hợp: vung tay, đánh nhịp</text><rect x="520" y="60" width="470" height="420" rx="14" fill="#EDE6D8" stroke="#8793A8" stroke-width="3"/><text x="755" y="100" font-size="28" fill="#16223A" text-anchor="middle" font-weight="700">IK: kéo bàn tay</text><polyline points="590,300 690,215 800,285" fill="none" stroke="#16223A" stroke-width="8"/><circle cx="590" cy="300" r="13" fill="#F0B13B" stroke="#16223A" stroke-width="3"/><text x="590" y="344" font-size="22" fill="#16223A" text-anchor="middle" font-weight="600">Vai</text><circle cx="690" cy="215" r="13" fill="#F0B13B" stroke="#16223A" stroke-width="3"/><text x="690" y="259" font-size="22" fill="#16223A" text-anchor="middle" font-weight="600">Khuỷu</text><circle cx="800" cy="285" r="13" fill="#F0B13B" stroke="#16223A" stroke-width="3"/><text x="800" y="329" font-size="22" fill="#16223A" text-anchor="middle" font-weight="600">Cổ tay</text><circle cx="880" cy="250" r="26" fill="none" stroke="#C2492E" stroke-width="5"/><text x="880" y="205" font-size="20" fill="#C2492E" text-anchor="middle" font-weight="700">control</text><line x1="810" y1="282" x2="841.0557280900008" y2="266.4721359549996" stroke="#C2492E" stroke-width="4"/><path d="M850 262 L841.4479337923798 273.08432061880563 L836.0013037803833 262.1910605948128 Z" fill="#C2492E"/><text x="755" y="400" font-size="22" fill="#4C5568" text-anchor="middle" font-weight="500">Kéo control ở bàn tay, vai và khuỷu</text><text x="755" y="430" font-size="22" fill="#4C5568" text-anchor="middle" font-weight="500">tự gập theo cho vừa.</text><text x="755" y="462" font-size="22" fill="#2E7D5B" text-anchor="middle" font-weight="700">Hợp: chống tay, chạm vật, chân bám sàn</text></svg>