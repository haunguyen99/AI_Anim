<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 238" width="980" height="238" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="980" height="238" fill="#FFFFFF"/><text x="20" y="34" font-size="20" fill="#4C5568" text-anchor="start" font-weight="500">Cỡ control hai bên (m). Xanh dương = bên phải, tím = bên trái</text><text x="20" y="90" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Shoulder</text><rect x="300" y="60" width="490" height="22" rx="4" fill="#3B6FB6"/><text x="798.0" y="78" font-size="19" fill="#3B6FB6" text-anchor="start" font-weight="700">R 0,84 m</text><rect x="300" y="86" width="88" height="22" rx="4" fill="#8A5FB5"/><text x="395.5" y="104" font-size="19" fill="#8A5FB5" text-anchor="start" font-weight="700">L 0,15 m</text><text x="20" y="154" font-size="22" fill="#16223A" text-anchor="start" font-weight="600">Hip</text><rect x="300" y="124" width="286" height="22" rx="4" fill="#3B6FB6"/><text x="593.8333333333333" y="142" font-size="19" fill="#3B6FB6" text-anchor="start" font-weight="700">R 0,49 m</text><rect x="300" y="150" width="105" height="22" rx="4" fill="#8A5FB5"/><text x="413.0" y="168" font-size="19" fill="#8A5FB5" text-anchor="start" font-weight="700">L 0,18 m</text><text x="20" y="224" font-size="18" fill="#4C5568" text-anchor="start" font-weight="500">Sửa: lấy bên đúng, lật sang bên kia như soi gương.</text></svg>