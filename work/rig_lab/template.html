<meta charset="utf-8">
<title>Gaygor Rig Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Bố cục: thanh bước ở trên, viewport 3D bên trái, bảng điều khiển bên phải; hẹp thì xếp dọc. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#d5d8de; --fg:#1b2230; --mute:#5d6676;
  --accent:#2f5fd0; --accent-fg:#ffffff; --view:#e6e9ee;
  --right:#d4483c; --left:#2c8a5a; --mid:#3a4252; --ok:#2c8a5a; --warn:#b9770e; --bad:#c23a30;
  --ref:#a07a00;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a202a; --line:#2c3441; --fg:#e4e8ef; --mute:#8d97a8;
  --accent:#6f95f0; --accent-fg:#0e1420; --view:#0d1117;
  --right:#ef6d60; --left:#52c58a; --mid:#c3cad6; --ok:#52c58a; --warn:#e0a53c; --bad:#ef6d60; --ref:#e0be4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a202a; --line:#2c3441; --fg:#e4e8ef; --mute:#8d97a8;
  --accent:#6f95f0; --accent-fg:#0e1420; --view:#0d1117;
  --right:#ef6d60; --left:#52c58a; --mid:#c3cad6; --ok:#52c58a; --warn:#e0a53c; --bad:#ef6d60; --ref:#e0be4a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:16px;margin:0;font-weight:600}
header{flex:none;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;margin-bottom:10px}
.sub{color:var(--mute);font-size:12px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer;display:flex;gap:8px;align-items:center}
.step[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.step .dot.ok{background:var(--ok)} .step .dot.fix{background:var(--bad)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);gap:12px}
#vp{position:relative;min-height:320px;background:var(--view);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.vbar{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.jbox{position:absolute;right:8px;top:48px;width:270px;max-width:calc(100% - 16px);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;z-index:3;font-size:12px}
.jbox .jhead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.jbox .jrow{display:flex;align-items:center;gap:8px}.jbox .jrow label{width:84px}.jbox .jrow input{flex:1;min-width:0}.jbox .jrow span{width:36px;text-align:right;font-family:var(--mono)}
.vhelp{position:absolute;right:8px;top:44px;z-index:4;font-size:11px;color:var(--mute);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:6px 10px;border-radius:6px;max-width:min(360px,70%);line-height:1.6}
.vbar2{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 8px;border-radius:6px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)} button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.bad{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
aside .pbody{flex:1;min-height:0;overflow:auto;padding:12px}
aside>.pbody:only-child{padding-bottom:12px}
aside h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px;font-weight:600}
aside h2:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mute)} .kv span:nth-child(even){font-family:var(--mono);text-align:right;font-size:12.5px}
.chk{display:grid;grid-template-columns:18px 1fr;gap:2px 6px;font-size:13px;margin:4px 0}
.chk i{font-style:normal;font-weight:700} .chk .s-ok{color:var(--ok)} .chk .s-warn{color:var(--warn)} .chk .s-bad{color:var(--bad)}
.chk small{grid-column:2;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
td,th{padding:2px 4px;border-bottom:1px solid var(--line);text-align:right} td:first-child,th:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
tr.sel td{background:color-mix(in srgb,var(--accent) 16%,transparent)}
tr.pick{cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
label.t{display:flex;gap:6px;align-items:center;font-size:13px}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.num label{font-size:11px;color:var(--mute);display:block} .num input{width:100%;font:12.5px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
textarea{width:100%;min-height:44px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px}
.gate{flex:none;margin:0;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--panel)}
.gate h2{margin:0 0 4px}
.big{font-size:15px;font-weight:600;margin:6px 0}.big.ok{color:var(--ok)}.big.warn{color:var(--warn)}
details.more{margin:10px 0;border-top:1px solid var(--line);padding-top:6px}
details.more>summary{cursor:pointer;color:var(--mute);font-size:12px;padding:2px 0}
details.more[open]>summary{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-size:11px;color:var(--mute)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.fix{color:var(--bad);border-color:var(--bad)}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:6px}.ghead .msg{margin-left:auto;min-height:0}
.dd{position:relative}.dd>summary{cursor:pointer;list-style:none;font-size:12px}.dd>summary::-webkit-details-marker{display:none}
.ddbox{position:absolute;left:0;bottom:calc(100% + 10px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:160px;z-index:5}
.helpbtn{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;padding:0;z-index:4}
.vhelp[hidden]{display:none}
.msg{font-size:12px;color:var(--mute);min-height:1.4em}
.err-hi{color:var(--bad)} .err-mid{color:var(--warn)}
.ltxt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
@media (min-width:901px){html,body{overflow:hidden}}
@media (max-width:900px){html,body{height:auto} main{display:block} aside{height:auto;overflow:visible;margin-top:12px} aside .pbody{overflow:visible} #vp{height:60vh}}
</style>

<header>
  <div><h1>Gaygor Rig Lab</h1></div>
  <div class="steps" role="tablist" id="steps"></div>
</header>
<main>
  <div id="vp">
    <canvas id="cv"></canvas>
    <div class="vbar" id="vbar"></div>
    <div class="vbar2" id="vopts"></div>
    <div class="jbox" id="jbox" hidden></div>
    <button class="helpbtn" id="helpBtn" aria-label="Hướng dẫn thao tác" title="Hướng dẫn thao tác">?</button>
    <div class="vhelp" id="vhelp" hidden>Alt + chuột trái: xoay<br>Alt + chuột giữa: kéo<br>Alt + chuột phải hoặc lăn: zoom<br>Click hoặc kéo khung: chọn (Shift đảo, Ctrl bỏ, Ctrl+Shift thêm)<br>Q chọn · W dời · E xoay · R co giãn<br>F nhìn vùng chọn · A nhìn toàn bộ · Ctrl+Z hoàn tác</div>
  </div>
  <aside id="panel"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script>
const DATA = /*DATA*/null;
const $ = id => document.getElementById(id);
const fix = (v, n = 1) => (+v).toFixed(n);

// ---------------------------------------------------------------- mẫu skeleton (tên theo rig khách)
const SIDE_J = ["Scapula", "Shoulder", "Elbow", "Wrist", "Hip", "Knee", "Ankle", "Toes", "ToesEnd"];
const LM_LABEL = { Root_M: "Hông (Root)", Spine1_M: "Eo", Chest_M: "Ngực", Neck_M: "Cổ", Head_M: "Đầu", HeadEnd_M: "Đỉnh đầu",
  DressFront_M: "Váy trước", DressBack_M: "Váy sau", Prop_M: "Điểm cầm prop", Weapon: "Chùy (pivot)", HandTip: "Đầu ngón giữa" };
const CENTER = ["Root_M", "Spine1_M", "Chest_M", "Neck_M", "Head_M", "HeadEnd_M", "DressFront_M", "DressBack_M", "Prop_M", "Weapon"];
const FINGERS = ["Middle", "Thumb", "Index", "Ring", "Pinky"];
const FKEYS = FINGERS.flatMap(f => [1, 2, 3].map(i => f + "Finger" + i));
const isFinger = k => /Finger\d_/.test(k);
const LM_ORDER = [...CENTER.slice(0, 6), ...["Scapula", "Shoulder", "Elbow", "Wrist"].map(n => n + "_R"), ...["Hip", "Knee", "Ankle", "Toes", "ToesEnd"].map(n => n + "_R"),
  ...["Scapula", "Shoulder", "Elbow", "Wrist"].map(n => n + "_L"), ...["Hip", "Knee", "Ankle", "Toes", "ToesEnd"].map(n => n + "_L"), ...CENTER.slice(6),
  ...FKEYS.map(n => n + "_R"), ...FKEYS.map(n => n + "_L")];
const sideOf = k => k.endsWith("_R") ? "R" : k.endsWith("_L") ? "L" : "M";
const mirrorKey = k => k.endsWith("_R") ? k.slice(0, -1) + "L" : k.endsWith("_L") ? k.slice(0, -1) + "R" : null;

function buildSkeleton(L) {
  const B = [], add = (name, parent, pos) => B.push({ name, parent, pos: pos.slice() });
  add("root", null, [0, 0, 0]);
  const P = n => L[n];
  [["Root_M", "root"], ["Spine1_M", "Root_M"], ["Chest_M", "Spine1_M"], ["Neck_M", "Chest_M"], ["Head_M", "Neck_M"], ["HeadEnd_M", "Head_M"]].forEach(([n, p]) => add(n, p, P(n)));
  for (const s of ["R", "L"]) {
    add("Scapula_" + s, "Chest_M", P("Scapula_" + s)); add("Shoulder_" + s, "Scapula_" + s, P("Shoulder_" + s));
    add("Elbow_" + s, "Shoulder_" + s, P("Elbow_" + s)); add("Wrist_" + s, "Elbow_" + s, P("Wrist_" + s));
    for (const f of FINGERS) for (const i of [1, 2, 3]) add(f + "Finger" + i + "_" + s, i > 1 ? f + "Finger" + (i - 1) + "_" + s : "Wrist_" + s, P(f + "Finger" + i + "_" + s));
  }
  add("Prop_M", "Chest_M", P("Prop_M")); add("DressFront_M", "Root_M", P("DressFront_M")); add("DressBack_M", "Root_M", P("DressBack_M"));
  for (const s of ["R", "L"]) for (const [i, n] of ["Hip", "Knee", "Ankle", "Toes", "ToesEnd"].entries())
    add(n + "_" + s, i ? ["Hip", "Knee", "Ankle", "Toes"][i - 1] + "_" + s : "Root_M", P(n + "_" + s));
  add("Weapon", "root", P("Weapon"));
  // twist: đoạn đầu (Shoulder/Hip) nhận roll NGƯỢC t lần roll của khớp đầu; đoạn cuối (Elbow/Knee) nhận roll +t lần roll của Wrist/Ankle
  const byName = {}; B.forEach(b => byName[b.name] = b);
  for (const s of ["R", "L"]) for (const st in TW_SEG) {
    const n = TW[st], a = byName[st + "_" + s], z = byName[TW_SEG[st][0] + "_" + s];
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1), proximal = st === "Shoulder" || st === "Hip";
      B.push({ name: st + "Twist" + i + "_" + s, parent: st + "_" + s, pos: a.pos.map((v, k) => v + (z.pos[k] - v) * t),
        twist: { source: proximal ? st + "_" + s : z.name, factor: +(proximal ? -t : t).toFixed(4), axis: "segment", segment: [st + "_" + s, z.name] } });
    }
  }
  return B;
}

// ngón sinh từ mẫu theo cổ tay + đầu ngón giữa; sau đó là khớp tự do
function initFingers(L, force) {
  for (const s of ["R", "L"]) {
    const w = L["Wrist_" + s], t = L["HandTip_" + s] || w, len = Math.abs(t[0] - w[0]) || 1, sg = s === "R" ? -1 : 1;
    for (const f of FINGERS) DATA.fingers[f].forEach((o, i) => { const k = f + "Finger" + (i + 1) + "_" + s;
      if (force || !L[k]) L[k] = [w[0] + sg * o[0] * len, w[1] + o[1] * len, w[2] + o[2] * len]; });
  }
}
// ---------------------------------------------------------------- trạng thái
let LM = JSON.parse(JSON.stringify(DATA.auto.landmarks));        // tên → [x,y,z]
initFingers(LM, true);
const S = new Set();
let undoS = [], redoS = [], cur = null;
let mode = "translate";
// twist joint: số lượng theo đoạn (khớp đầu đoạn), áp cho cả R và L. Tên: <Khớp đầu>Twist<i>_<R|L>
const TW_SEG = { Shoulder: ["Elbow", "Cánh tay trên"], Elbow: ["Wrist", "Cẳng tay"], Hip: ["Knee", "Đùi"], Knee: ["Ankle", "Cẳng chân"] };
let TW = { Shoulder: 0, Elbow: 0, Hip: 0, Knee: 0 };
const vis = { body: true, props: DATA.props.map(() => true) };
let step = 1, sel = null, mirror = true, showRef = false, showWire = false, showSkel = true, showFing = true;
let gates = { 1: null, 2: null, 3: null, 4: null, 5: null };
let db = null, saveMsg = "";

// ---------------------------------------------------------------- three.js
const cv = $("cv"), vp = $("vp");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(22, 1, 10, 4000);
const orbit = new THREE.OrbitControls(cam, cv);
const TARGET = new THREE.Vector3(0, DATA.auto.H * 0.5, 0);
orbit.target.copy(TARGET); orbit.mouseButtons = { LEFT: -1, MIDDLE: -1, RIGHT: -1 };
scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 0.6); dl.position.set(200, 400, 500); scene.add(dl);

function meshFrom(m, color, opacity) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(m.verts, 3));
  g.setIndex(m.tris); g.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false });
  const mesh = new THREE.Mesh(g, mat);
  const wire = new THREE.LineSegments(new THREE.WireframeGeometry(g), new THREE.LineBasicMaterial({ color: 0x8aa0c0, transparent: true, opacity: .35 }));
  wire.visible = false; mesh.add(wire); mesh.userData.wire = wire;
  return mesh;
}
const bodyMesh = meshFrom(DATA.body, 0x8a96aa, 0.55); scene.add(bodyMesh);
const propMeshes = DATA.props.map(p => { const m = meshFrom(p, 0xb59a6a, 0.55); scene.add(m); return m; });

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const lmGroup = new THREE.Group(); scene.add(lmGroup);
const lmMesh = {};
const sphereGeo = new THREE.SphereGeometry(2.6, 14, 10);
for (const k of LM_ORDER) {
  const m = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
  m.renderOrder = 10; m.userData.key = k; lmGroup.add(m); lmMesh[k] = m;
}
const skelLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
skelLines.renderOrder = 8; scene.add(skelLines);
const twPts = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ size: 7, sizeAttenuation: false, depthTest: false, color: 0xffaa00 }));
twPts.renderOrder = 9; scene.add(twPts);
const skelPts = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ size: 4, sizeAttenuation: false, depthTest: false, color: 0xffffff }));
skelPts.renderOrder = 9; scene.add(skelPts);
const refLines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ depthTest: false, transparent: true, opacity: .85 }));
refLines.renderOrder = 7; scene.add(refLines);
{
  const pos = [], idx = {}; DATA.ref.forEach((b, i) => idx[b.name] = b);
  DATA.ref.forEach(b => { if (b.parent && b.parent !== "root" && idx[b.parent]) pos.push(...idx[b.parent].pos, ...b.pos); });
  refLines.geometry.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
}
const grid = new THREE.GridHelper(500, 20, 0x667080, 0x3a4252); grid.material.transparent = true; grid.material.opacity = .35; scene.add(grid);

const tc = new THREE.TransformControls(cam, cv); tc.setSize(0.8); scene.add(tc);
const pivot = new THREE.Object3D(); scene.add(pivot);
let start = null, startM = new THREE.Matrix4();
function centroid() { const c = new THREE.Vector3(); S.forEach(k => c.add(new THREE.Vector3(...LM[k]))); return c.multiplyScalar(1 / Math.max(S.size, 1)); }
function resetPivot() { pivot.position.copy(centroid()); pivot.quaternion.identity(); pivot.scale.set(1, 1, 1); pivot.updateMatrix(); }
tc.addEventListener("dragging-changed", e => {
  orbit.enabled = !e.value;
  if (e.value) { pivot.updateMatrix(); startM.copy(pivot.matrix).invert(); start = {}; S.forEach(k => start[k] = new THREE.Vector3(...LM[k])); }
  else { start = null; resetPivot(); commit(); }
});
tc.addEventListener("objectChange", () => {
  if (!start) return;
  pivot.updateMatrix(); const M = pivot.matrix.clone().multiply(startM);
  for (const k in start) { const v = start[k].clone().applyMatrix4(M); LM[k] = [v.x, v.y, v.z]; }
  if (mirror) {
    for (const k of S) {
      const m = mirrorKey(k);
      if (!m) { LM[k][0] = 0; continue; }
      if (sideOf(k) === "R" || !S.has(m)) LM[m] = [-LM[k][0], LM[k][1], LM[k][2]];
    }
  }
  syncScene(true); dirty();
});

function setView(v) {
  const t = TARGET, tf = Math.tan(cam.fov * Math.PI / 360), d = Math.max(115 / tf, (v === 'front' ? 205 : 130) / (tf * cam.aspect));
  const dirs = { front: [0, 0, 1], side: [1, 0, 0], top: [0, 1, 0.0001], persp: [0.7, 0.35, 1] };
  const u = new THREE.Vector3(...dirs[v]).normalize();
  cam.position.copy(t).addScaledVector(u, d); cam.up.set(0, 1, 0);
  if (v === "top") cam.up.set(0, 0, -1);
  orbit.target.copy(t); orbit.update();
}
function resize() {
  const w = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(vp);

function lmColor(k) { return css(sideOf(k) === "R" ? "--right" : sideOf(k) === "L" ? "--left" : "--mid"); }
function syncScene(dragging) {
  for (const k of LM_ORDER) {
    const m = lmMesh[k]; m.position.set(...LM[k]);
    m.material.color.set(lmColor(k));
    m.scale.setScalar(S.has(k) ? 1.5 : 1);
    m.visible = step === 2 && (showFing || !isFinger(k));
    if (isFinger(k)) m.scale.setScalar(S.has(k) ? 1.2 : 0.6);
    m.material.color.set(S.has(k) ? css("--accent") : lmColor(k));
  }
  // skeleton
  const B = buildSkeleton(LM), idx = {}; B.forEach(b => idx[b.name] = b);
  const seg = [], pts = [], tpts = [], PB = step >= 4 && SK ? posedBones(B) : null, ps = b => PB ? PB[b.name] : b.pos;
