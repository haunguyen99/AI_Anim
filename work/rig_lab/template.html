<meta charset="utf-8">
<title>__NAME__ Rig Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Bố cục: thanh bước ở trên, viewport 3D bên trái, bảng điều khiển bên phải; hẹp thì xếp dọc. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#d5d8de; --fg:#1b2230; --mute:#5d6676;
  --accent:#2f5fd0; --accent-fg:#ffffff; --view:#e6e9ee;
  --right:#d4483c; --left:#2c8a5a; --mid:#3a4252; --ok:#2c8a5a; --warn:#b9770e; --bad:#c23a30;
  --ref:#a07a00;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a202a; --line:#2c3441; --fg:#e4e8ef; --mute:#8d97a8;
  --accent:#6f95f0; --accent-fg:#0e1420; --view:#0d1117;
  --right:#ef6d60; --left:#52c58a; --mid:#c3cad6; --ok:#52c58a; --warn:#e0a53c; --bad:#ef6d60; --ref:#e0be4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a202a; --line:#2c3441; --fg:#e4e8ef; --mute:#8d97a8;
  --accent:#6f95f0; --accent-fg:#0e1420; --view:#0d1117;
  --right:#ef6d60; --left:#52c58a; --mid:#c3cad6; --ok:#52c58a; --warn:#e0a53c; --bad:#ef6d60; --ref:#e0be4a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:16px;margin:0;font-weight:600}
header{flex:none;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;margin-bottom:10px}
.sub{color:var(--mute);font-size:12px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 12px;border-radius:6px;font:inherit;cursor:pointer;display:flex;gap:8px;align-items:center}
.step[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.step .dot.ok{background:var(--ok)} .step .dot.fix{background:var(--bad)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr);gap:12px}
#vp{position:relative;min-height:320px;background:var(--view);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.vbar{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.jbox{position:absolute;right:8px;top:48px;width:270px;max-width:calc(100% - 16px);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 10px;z-index:3;font-size:12px}
.jbox .jhead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.jbox .jrow{display:flex;align-items:center;gap:8px}.jbox .jrow label{width:84px}.jbox .jrow input{flex:1;min-width:0}.jbox .jrow span{width:36px;text-align:right;font-family:var(--mono)}
.vhelp{position:absolute;right:8px;top:44px;z-index:4;font-size:11px;color:var(--mute);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:6px 10px;border-radius:6px;max-width:min(360px,70%);line-height:1.6}
.vbar2{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 8px;border-radius:6px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)} button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.bad{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
aside .pbody{flex:1;min-height:0;overflow:auto;padding:12px}
aside>.pbody:only-child{padding-bottom:12px}
aside h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px;font-weight:600}
aside h2:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mute)} .kv span:nth-child(even){font-family:var(--mono);text-align:right;font-size:12.5px}
.chk{display:grid;grid-template-columns:18px 1fr;gap:2px 6px;font-size:13px;margin:4px 0}
.chk i{font-style:normal;font-weight:700} .chk .s-ok{color:var(--ok)} .chk .s-warn{color:var(--warn)} .chk .s-bad{color:var(--bad)}
.chk small{grid-column:2;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
td,th{padding:2px 4px;border-bottom:1px solid var(--line);text-align:right} td:first-child,th:first-child{text-align:left}
th{color:var(--mute);font-weight:500}
tr.sel td{background:color-mix(in srgb,var(--accent) 16%,transparent)}
tr.pick{cursor:pointer}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
label.t{display:flex;gap:6px;align-items:center;font-size:13px}
.num{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.num label{font-size:11px;color:var(--mute);display:block} .num input{width:100%;font:12.5px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
textarea{width:100%;min-height:44px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px}
.gate{flex:none;margin:0;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--panel)}
.gate h2{margin:0 0 4px}
.big{font-size:15px;font-weight:600;margin:6px 0}.big.ok{color:var(--ok)}.big.warn{color:var(--warn)}.big.bad{color:var(--bad, #c0392b)}
details.more{margin:10px 0;border-top:1px solid var(--line);padding-top:6px}
details.more>summary{cursor:pointer;color:var(--mute);font-size:12px;padding:2px 0}
details.more[open]>summary{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-size:11px;color:var(--mute)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.fix{color:var(--bad);border-color:var(--bad)}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:6px}.ghead .msg{margin-left:auto;min-height:0}
.dd{position:relative}.dd>summary{cursor:pointer;list-style:none;font-size:12px}.dd>summary::-webkit-details-marker{display:none}
.ddbox{position:absolute;left:0;bottom:calc(100% + 10px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:160px;z-index:5}
.helpbtn{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;padding:0;z-index:4}
.vhelp[hidden]{display:none}
.msg{font-size:12px;color:var(--mute);min-height:1.4em}
.err-hi{color:var(--bad)} .err-mid{color:var(--warn)}
.ltxt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
@media (min-width:901px){html,body{overflow:hidden}}
@media (max-width:900px){html,body{height:auto} main{display:block} aside{height:auto;overflow:visible;margin-top:12px} aside .pbody{overflow:visible} #vp{height:60vh}}
/*IBTN*/
.ibtn{font-size:0!important;line-height:0;display:inline-flex;align-items:center;justify-content:center;gap:0;width:34px;height:32px;padding:0!important;flex:none}
.ibtn::before{content:'';width:18px;height:18px;flex:none;background:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.step.ibtn{width:auto;padding:0 14px!important;gap:8px;height:34px}.step.ibtn .dot{order:-1}.step.ibtn::before{width:20px;height:20px}
.gate .chip.ibtn{width:22px;height:22px;border:0;background:none;padding:0!important}.chip.ibtn.ok{color:var(--ok)}.chip.ibtn.fix{color:var(--bad)}.chip.ibtn:not(.ok):not(.fix){color:var(--mute)}
#vopts summary.ibtn{width:30px;height:28px}#vopts .dd>summary.ibtn::before{width:18px;height:18px}
#helpBtn.ibtn{width:30px;height:30px;border-radius:50%}
#vbar .ibtn,.row .ibtn{border-radius:6px}
.ibtn.pri::before{background:currentColor}

<script>
/*LOCALDB*/
// Kho dữ liệu trên máy cho các Lab khi không có db của claude.ai: nói chuyện với Home server (tools/home/store.py), ghi file thật vào work/store/<ns>/.
// Cùng giao diện với db của artifact (doc/collection, get/set/update/delete/add/onSnapshot) nên mã Lab không phải đổi.
// Kèm nút "Lưu trữ" (xuất / mở file .json). Nguồn: tools/home/localdb.js, nhúng bằng work/patch_localdb.py.
(function () {
  const API = (window.LOCALDB_API || "http://127.0.0.1:8780") + "/api/store";
  const slug = s => String(s || "page").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 80) || "page";
  const NS = (new URLSearchParams(location.search).get("ns")) || slug(document.title);
  const enc = encodeURIComponent;
  async function call(method, path, body) {
    const r = await fetch(API + "/" + path, { method, headers: body !== undefined ? { "Content-Type": "application/json" } : {}, body: body !== undefined ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error("store " + r.status);
    return r.json();
  }
  const snapOf = (id, data) => ({ id, exists: data !== null && data !== undefined, data: () => data });
  const watchers = {};   // col → { subs:Set, last:string, timer }
  async function fetchCol(col) { const r = await call("GET", enc(NS) + "/" + enc(col)); return r.docs; }
  const colSnap = docs => { const d = docs.map(x => snapOf(x.id, x.data)); return { docs: d, size: d.length, empty: !d.length, forEach: f => d.forEach(f) }; };
  async function tick(col) {
    const w = watchers[col]; if (!w || !w.subs.size) return;
    try {
      const docs = await fetchCol(col), sig = JSON.stringify(docs);
      if (sig !== w.last) { w.last = sig; const sn = colSnap(docs); w.subs.forEach(f => { try { f(sn); } catch (e) { console.error(e); } }); }
    } catch (e) {}
  }
  const poke = col => { if (watchers[col]) tick(col); };
  function docRef(col, id) {
    const base = () => enc(NS) + "/" + enc(col) + "/" + id.split("/").map(enc).join("/");
    return {
      id, path: col + "/" + id,
      get: async () => { const r = await call("GET", base()); return snapOf(id, r.exists ? r.data : null); },
      set: async d => { await call("PUT", base(), d); poke(col); },
      update: async d => { await call("PATCH", base(), d); poke(col); },
      delete: async () => { await call("DELETE", base()); poke(col); },
    };
  }
  function colRef(col) {
    return {
      id: col, doc: id => docRef(col, id),
      get: async () => colSnap(await fetchCol(col)),
      add: async d => { const r = await call("POST", enc(NS) + "/" + enc(col), d); poke(col); return docRef(col, r.id); },
      onSnapshot: cb => {
        const w = watchers[col] || (watchers[col] = { subs: new Set(), last: null, timer: 0 });
        w.subs.add(cb); w.last = null; tick(col);
        if (!w.timer) w.timer = setInterval(() => tick(col), 2000);
        return () => { w.subs.delete(cb); if (!w.subs.size) { clearInterval(w.timer); w.timer = 0; } };
      },
    };
  }
  const db = { isLocal: true, ns: NS, doc: path => { const [c, ...r] = path.split("/"); return docRef(c, r.join("/")); }, collection: colRef };
  window.localDB = async function () {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 1200);
      const r = await fetch(API + "/_ping", { signal: ctl.signal }); clearTimeout(t);
      if (!r.ok) return null; await r.json(); return db;
    } catch (e) { return null; }
  };

  // ---- nút Lưu trữ: nơi lưu hiện tại, xuất / mở file .json
  const ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.700 3.100 3 7 3s7-1.300 7-3V6M5 12v6c0 1.700 3.100 3 7 3s7-1.300 7-3v-6"/></svg>';
  const css = document.createElement("style");
  css.textContent = ".dbw{position:relative;display:inline-flex;align-items:center}.dbw>button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;padding:0;border-radius:8px;border:1px solid var(--line,#2a2f38);background:var(--raise,var(--panel,#1d2026));color:var(--fg,var(--text,#e6e9ee));cursor:pointer;position:relative}.dbw>button i{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#3ab06f}.dbw>button.warn i{background:#e3a008}.dbm{position:fixed;z-index:60;min-width:250px;max-width:min(340px,calc(100vw - 16px));padding:10px;border-radius:10px;background:var(--panel,#1d2026);color:var(--fg,var(--text,#e6e9ee));border:1px solid var(--line,#2a2f38);box-shadow:0 8px 24px #0004;font:12px/1.4 system-ui,sans-serif;display:none}.dbm.show{display:block}.dbm b{display:block;font-size:12px;margin-bottom:2px}.dbm p{margin:0 0 8px;color:var(--mute,var(--muted,#8b93a0));word-break:break-all}.dbm .r{display:flex;gap:6px}.dbm button{flex:1;height:32px;border-radius:8px;border:1px solid var(--line,#2a2f38);background:var(--raise,var(--bg,#14161a));color:inherit;cursor:pointer;font:inherit}.dbm .t{margin-top:8px;color:var(--accent,#4aa3ff)}body.tm .dbw>button{width:40px;height:40px}body.tm .dbm button{height:40px}";
  document.head.appendChild(css);
  window.dbWidget = function (o) {
    const { db: d, cols, host } = o;
    if (document.getElementById("dbW")) document.getElementById("dbW").remove();
    const local = !!(d && d.isLocal), ok = !!d;
    const where = local ? "Máy này: work/store/" + NS : ok ? "claude.ai: AI đọc được" : "Chỉ trình duyệt này (chưa nối kho)";
    const w = document.createElement("span"); w.className = "dbw"; w.id = "dbW";
    w.innerHTML = '<button type="button" title="Lưu trữ: xuất / mở file" aria-label="Lưu trữ" class="' + (ok ? "" : "warn") + '">' + ICON + '<i></i></button><div class="dbm" role="dialog"><b>Nơi lưu</b><p>' + where + '</p><div class="r"><button type="button" data-a="ex">Xuất file</button><button type="button" data-a="im">Mở file</button></div><div class="t" hidden></div><input type="file" accept=".json,application/json" hidden></div>';

    if (hostEl) hostEl.appendChild(w); else { w.style.cssText = "position:fixed;right:8px;bottom:8px;z-index:50"; document.body.appendChild(w); }
    const btn = w.querySelector("button"), menu = w.querySelector(".dbm"), msg = w.querySelector(".t"), file = w.querySelector("input");
