<meta charset="utf-8">
<title>__NAME__ Mesh Lab</title>

<style>
/* Mesh Lab: sửa mesh cơ bản trước khi rig. Viewport 3D bên trái, bảng bên phải; hẹp thì xếp dọc. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --line:#d5d8de; --fg:#1b2230; --mute:#5d6676;
  --accent:#2f5fd0; --accent-fg:#ffffff; --view:#e6e9ee; --raise:#f3f4f6;
  --ok:#2c8a5a; --warn:#b9770e; --bad:#c23a30;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a202a; --line:#2c3441; --fg:#e4e8ef; --mute:#8d97a8; --raise:#141a23;
  --accent:#6f95f0; --accent-fg:#0e1420; --view:#0d1117; --ok:#52c58a; --warn:#e0a53c; --bad:#ef6d60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a202a; --line:#2c3441; --fg:#e4e8ef; --mute:#8d97a8; --raise:#141a23;
  --accent:#6f95f0; --accent-fg:#0e1420; --view:#0d1117; --ok:#52c58a; --warn:#e0a53c; --bad:#ef6d60; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
h1{font-size:16px;margin:0;font-weight:600}
header{flex:none;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
header .sp{flex:1}
.sub{color:var(--mute);font-size:12px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
#vp{position:relative;min-height:320px;background:var(--view);border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)} button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.bad{border-color:var(--bad);color:var(--bad)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
.tb{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px);z-index:3}
.tb .grp{display:flex;gap:2px;padding:2px;border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line)}
.tb button{width:32px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-color:transparent;background:transparent}
.tb button.on{background:var(--accent);color:var(--accent-fg)}
.vinfo{position:absolute;left:8px;bottom:8px;font-size:12px;font-family:var(--mono);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 8px;border-radius:6px;z-index:3;max-width:calc(100% - 16px)}
.marquee{position:absolute;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);display:none;pointer-events:none}
aside{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
aside .pbody{flex:1;min-height:0;overflow:auto;padding:10px 12px 14px}
aside h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px;font-weight:600}
aside h2:first-child{margin-top:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.row label{font-size:12px;color:var(--mute)}
.row input[type=range]{flex:1;min-width:80px}
.row input[type=number]{width:70px;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.ops button{display:flex;align-items:center;gap:6px;justify-content:flex-start;font-size:12.5px;padding:5px 8px;text-align:left}
.olist{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.orow{display:flex;align-items:center;gap:2px;height:30px;padding:0 3px 0 8px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.orow.sel{background:color-mix(in srgb,var(--accent) 20%,transparent);font-weight:600}
.orow.act{box-shadow:inset 3px 0 0 var(--accent)}
.orow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .nm input{width:100%;font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:4px}
.orow small{color:var(--mute);font-family:var(--mono);font-size:11px;margin-right:2px}
.orow button{width:26px;height:26px;padding:0;border:0;background:transparent;color:var(--mute);display:inline-flex;align-items:center;justify-content:center}
.orow button:hover{color:var(--fg)} .orow button.off{opacity:.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mute)} .kv span:nth-child(even){font-family:var(--mono);text-align:right;font-size:12.5px}
.chk{display:grid;grid-template-columns:18px 1fr;gap:1px 6px;font-size:13px;margin:3px 0}
.chk i{font-style:normal;font-weight:700}.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}
.msg{font-size:12px;color:var(--mute);min-height:1.4em;margin-top:6px}
.tmchk{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:var(--mute);padding:0 6px}
.tmchk input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
#tmBar{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:none;gap:6px;padding:5px;border-radius:12px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);z-index:6}
body.tm #tmBar{display:flex}
#tmBar button{width:48px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center}
#tmBar svg.i{width:24px;height:24px}
body.tm button{min-height:38px} body.tm .tb button{width:40px;height:38px} body.tm .orow{height:40px} body.tm .orow button{width:36px;height:36px}
body.tm input{font-size:16px}
@media (max-width:900px){html,body{height:auto} body{display:block} main{display:block} aside{margin-top:10px} #vp{height:62vh}}
@media (min-width:901px){html,body{overflow:hidden}}

/*CHBOX*/
#chbox{position:absolute;right:8px;top:8px;width:196px;z-index:4;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;font-size:12px;overflow:hidden;backdrop-filter:blur(4px)}
#chbox .chh{display:flex;align-items:center;gap:6px;padding:6px 8px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
#chbox .chh b{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
#chbox .chh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
#chbox .chh svg{width:14px;height:14px;transition:transform .15s}
#chbox.fold .chh{border-bottom:0} #chbox.fold .chh svg{transform:rotate(-90deg)} #chbox.fold .chr,#chbox.fold .chf{display:none}
#chbox .chr{display:grid;grid-template-columns:1fr 74px;align-items:center;gap:6px;padding:1px 8px}
#chbox .chr label{color:var(--mute);cursor:ew-resize;user-select:none;touch-action:none;padding:3px 0}
#chbox .chr label:hover{color:var(--fg)}
#chbox .chr input{width:100%;font:12px var(--mono);text-align:right;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
#chbox .chs{padding:5px 8px 2px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
#chbox .chf{display:flex;gap:6px;padding:6px 8px 8px}
#chbox .chf button{flex:1;font-size:11.5px;padding:3px 4px}
#chbox .chn{padding:8px;color:var(--mute)}
body.tm #chbox .chr{padding:3px 8px} body.tm #chbox .chr input{padding:6px 5px;font-size:14px}
@media (max-width:900px){#chbox{width:176px}}
</style>

<script>
/*LOCALDB*/
// Kho dữ liệu trên máy cho các Lab khi không có db của claude.ai: nói chuyện với Home server (tools/home/store.py), ghi file thật vào work/store/<ns>/.
// Cùng giao diện với db của artifact (doc/collection, get/set/update/delete/add/onSnapshot) nên mã Lab không phải đổi.
// Kèm nút "Lưu trữ" (xuất / mở file .json). Nguồn: tools/home/localdb.js, nhúng bằng work/patch_localdb.py.
(function () {
  const API = (window.LOCALDB_API || "http://127.0.0.1:8780") + "/api/store";
  const slug = s => String(s || "page").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 80) || "page";
  const NS = (new URLSearchParams(location.search).get("ns")) || slug(document.title);
  const enc = encodeURIComponent;
  async function call(method, path, body) {
    const r = await fetch(API + "/" + path, { method, headers: body !== undefined ? { "Content-Type": "application/json" } : {}, body: body !== undefined ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error("store " + r.status);
    return r.json();
  }
  const snapOf = (id, data) => ({ id, exists: data !== null && data !== undefined, data: () => data });
  const watchers = {};   // col → { subs:Set, last:string, timer }
  async function fetchCol(col) { const r = await call("GET", enc(NS) + "/" + enc(col)); return r.docs; }
  const colSnap = docs => { const d = docs.map(x => snapOf(x.id, x.data)); return { docs: d, size: d.length, empty: !d.length, forEach: f => d.forEach(f) }; };
  async function tick(col) {
    const w = watchers[col]; if (!w || !w.subs.size) return;
    try {
      const docs = await fetchCol(col), sig = JSON.stringify(docs);
      if (sig !== w.last) { w.last = sig; const sn = colSnap(docs); w.subs.forEach(f => { try { f(sn); } catch (e) { console.error(e); } }); }
    } catch (e) {}
  }
  const poke = col => { if (watchers[col]) tick(col); };
  function docRef(col, id) {
    const base = () => enc(NS) + "/" + enc(col) + "/" + id.split("/").map(enc).join("/");
    return {
      id, path: col + "/" + id,
      get: async () => { const r = await call("GET", base()); return snapOf(id, r.exists ? r.data : null); },
      set: async d => { await call("PUT", base(), d); poke(col); },
      update: async d => { await call("PATCH", base(), d); poke(col); },
      delete: async () => { await call("DELETE", base()); poke(col); },
    };
  }
  function colRef(col) {
    return {
      id: col, doc: id => docRef(col, id),
      get: async () => colSnap(await fetchCol(col)),
      add: async d => { const r = await call("POST", enc(NS) + "/" + enc(col), d); poke(col); return docRef(col, r.id); },
      onSnapshot: cb => {
        const w = watchers[col] || (watchers[col] = { subs: new Set(), last: null, timer: 0 });
        w.subs.add(cb); w.last = null; tick(col);
        if (!w.timer) w.timer = setInterval(() => tick(col), 2000);
        return () => { w.subs.delete(cb); if (!w.subs.size) { clearInterval(w.timer); w.timer = 0; } };
      },
    };
  }
  const db = { isLocal: true, ns: NS, doc: path => { const [c, ...r] = path.split("/"); return docRef(c, r.join("/")); }, collection: colRef };
  window.localDB = async function () {
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 1200);
      const r = await fetch(API + "/_ping", { signal: ctl.signal }); clearTimeout(t);
      if (!r.ok) return null; await r.json(); return db;
    } catch (e) { return null; }
  };

  // ---- nút Lưu trữ: nơi lưu hiện tại, xuất / mở file .json
  const ICON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.700 3.100 3 7 3s7-1.300 7-3V6M5 12v6c0 1.700 3.100 3 7 3s7-1.300 7-3v-6"/></svg>';
  const css = document.createElement("style");
  css.textContent = ".dbw{position:relative;display:inline-flex;align-items:center}.dbw>button{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;padding:0;border-radius:8px;border:1px solid var(--line,#2a2f38);background:var(--raise,var(--panel,#1d2026));color:var(--fg,var(--text,#e6e9ee));cursor:pointer;position:relative}.dbw>button i{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#3ab06f}.dbw>button.warn i{background:#e3a008}.dbm{position:fixed;z-index:60;min-width:250px;max-width:min(340px,calc(100vw - 16px));padding:10px;border-radius:10px;background:var(--panel,#1d2026);color:var(--fg,var(--text,#e6e9ee));border:1px solid var(--line,#2a2f38);box-shadow:0 8px 24px #0004;font:12px/1.4 system-ui,sans-serif;display:none}.dbm.show{display:block}.dbm b{display:block;font-size:12px;margin-bottom:2px}.dbm p{margin:0 0 8px;color:var(--mute,var(--muted,#8b93a0));word-break:break-all}.dbm .r{display:flex;gap:6px}.dbm button{flex:1;height:32px;border-radius:8px;border:1px solid var(--line,#2a2f38);background:var(--raise,var(--bg,#14161a));color:inherit;cursor:pointer;font:inherit}.dbm .t{margin-top:8px;color:var(--accent,#4aa3ff)}body.tm .dbw>button{width:40px;height:40px}body.tm .dbm button{height:40px}";
  document.head.appendChild(css);
  window.dbWidget = function (o) {
    const { db: d, cols, host } = o;
    if (document.getElementById("dbW")) document.getElementById("dbW").remove();
    const local = !!(d && d.isLocal), ok = !!d;
    const where = local ? "Máy này: work/store/" + NS : ok ? "claude.ai: AI đọc được" : "Chỉ trình duyệt này (chưa nối kho)";
    const w = document.createElement("span"); w.className = "dbw"; w.id = "dbW";
    w.innerHTML = '<button type="button" title="Lưu trữ: xuất / mở file" aria-label="Lưu trữ" class="' + (ok ? "" : "warn") + '">' + ICON + '<i></i></button><div class="dbm" role="dialog"><b>Nơi lưu</b><p>' + where + '</p><div class="r"><button type="button" data-a="ex">Xuất file</button><button type="button" data-a="im">Mở file</button></div><div class="t" hidden></div><input type="file" accept=".json,application/json" hidden></div>';
    const hostEl = (host && document.querySelector(host)) || null;
    if (hostEl) hostEl.appendChild(w); else { w.style.cssText = "position:fixed;right:8px;bottom:8px;z-index:50"; document.body.appendChild(w); }
    const btn = w.querySelector("button"), menu = w.querySelector(".dbm"), msg = w.querySelector(".t"), file = w.querySelector("input");
    const say = t => { msg.textContent = t; msg.hidden = !t; };
    btn.onclick = e => { e.stopPropagation(); const on = !menu.classList.contains("show"); menu.classList.toggle("show", on); if (on) { const r = btn.getBoundingClientRect(); menu.style.top = Math.min(r.bottom + 6, innerHeight - menu.offsetHeight - 8) + "px"; menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px"; } };
    document.addEventListener("click", e => { if (!w.contains(e.target)) menu.classList.remove("show"); });
    w.addEventListener("click", async e => {
      const a = e.target.closest("[data-a]"); if (!a) return;
      if (a.dataset.a === "im") { file.click(); return; }
      if (!d) { say("Chưa có kho để xuất. Mở bằng Home hoặc trên claude.ai."); return; }
      try {
        const out = { format: "ddc-store-v1", ns: NS, title: document.title, at: new Date().toISOString(), collections: {} };
        for (const c of cols) { const sn = await d.collection(c).get(); out.collections[c] = {}; sn.docs.forEach(s => { if (s.exists) out.collections[c][s.id] = s.data(); }); }
        const n = Object.values(out.collections).reduce((s, c) => s + Object.keys(c).length, 0);
        const name = NS + "_" + new Date().toISOString().slice(0, 10) + ".json", blob = new Blob([JSON.stringify(out)], { type: "application/json" });
        let saved = false;
        try { if (window.claude && window.claude.use) { const dl = await window.claude.use("downloads"); if (dl) { await dl.save({ filename: name, data: blob }); saved = true; } } } catch (e2) {}
        if (!saved) { const u = URL.createObjectURL(blob), an = document.createElement("a"); an.href = u; an.download = name; document.body.appendChild(an); an.click(); an.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
        say("Đã xuất " + n + " mục → " + name);
      } catch (err) { say("Không xuất được: " + (err.message || err)); }
    });
    file.onchange = async () => {
      const f = file.files[0]; file.value = ""; if (!f) return;
      try {
        const o2 = JSON.parse(await f.text());
        if (o2.format !== "ddc-store-v1" || !o2.collections) throw new Error("không phải file lưu của Lab");
        if (!d) throw new Error("chưa có kho để ghi");
        let n = 0; for (const c in o2.collections) for (const id in o2.collections[c]) { await d.doc(c + "/" + id).set(o2.collections[c][id]); n++; }
        say("Đã mở " + n + " mục từ " + f.name + (o2.ns && o2.ns !== NS ? " (nguồn: " + o2.ns + ")" : "") + ". Tải lại trang để thấy.");
      } catch (err) { say("Không mở được: " + (err.message || err)); }
    };
  };
})();
</script>

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const IC = {
  obj: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',

  rot: '<path d="M20 12a8 8 0 11-3-6.200"/><path d="M20 4v5h-5"/>', scl: '<path d="M5 19L19 5M13 5h6v6M5 13v6h6"/>',

function closestOnAxis(r, O, D) {   // điểm trên đường thẳng (O, D) gần tia chuột nhất, trả tham số t
  const w0 = O.clone().sub(r.origin), a = D.dot(D), b = D.dot(r.direction), c = r.direction.dot(r.direction), d = D.dot(w0), e2 = r.direction.dot(w0), den = a * c - b * b;
  return Math.abs(den) < 1e-9 ? 0 : (b * e2 - c * d) / den;
}
function planeHit(r, P) { const n = cam.getWorldDirection(new V3x()); const pl = new THREE.Plane().setFromNormalAndCoplanarPoint(n, P); return r.intersectPlane(pl, new V3x()); }
cv.addEventListener("pointerdown", e => {
  if (tool !== "free" || !FREE.group.visible || e.button !== 0 || e.altKey && false) return;
  ray.setFromCamera(ndc(e.clientX, e.clientY), cam);
  const hit = ray.intersectObjects(FREE.hs, false)[0]; if (!hit) return;

  const h = hit.object.userData, b = FREE.box.clone(), c = b.getCenter(new V3x());
  pushUndo(); ensureTS(); fdrag = { h, b, c, aff: affSnapshot(), A0: TS.A.clone(), start: e.clientX + "," + e.clientY }; orbit.enabled = false; cv.setPointerCapture(e.pointerId);
}, true);
function freeMove(e) {
  const d = fdrag; if (!d) return; const r = rayAt(e), h = d.h, b = d.b, c = d.c; let M = new M4x();
  const anchorAt = (ax, sg) => (e.altKey ? c.getComponent(ax) : (sg ? b.min.getComponent(ax) : b.max.getComponent(ax)));
  if (h.t === "face") {
    const ax = h.ax, hp = h.sg ? b.max.getComponent(ax) : b.min.getComponent(ax), an = anchorAt(ax, h.sg), O = c.clone(); O.setComponent(ax, hp);
    const D = new V3x(); D.setComponent(ax, 1); const t = closestOnAxis(r, O, D), np = hp + t, den = hp - an;
    if (Math.abs(den) < 1e-6) return; let sc = (np - an) / den; sc = Math.max(0.01, sc);
    const S = new V3x(1, 1, 1); if (e.shiftKey) S.set(sc, sc, sc); else S.setComponent(ax, sc);
    const pivotP = c.clone(); pivotP.setComponent(ax, an); if (e.shiftKey) pivotP.copy(e.altKey ? c : new V3x(...[0, 1, 2].map(k => k === ax ? an : (e.altKey ? c.getComponent(k) : c.getComponent(k)))));
    M = new M4x().makeTranslation(pivotP.x, pivotP.y, pivotP.z).multiply(new M4x().makeScale(S.x, S.y, S.z)).multiply(new M4x().makeTranslation(-pivotP.x, -pivotP.y, -pivotP.z));
  } else if (h.t === "corner") {
    const cp = new V3x(h.sg[0] ? b.max.x : b.min.x, h.sg[1] ? b.max.y : b.min.y, h.sg[2] ? b.max.z : b.min.z), an = e.altKey ? c.clone() : new V3x(h.sg[0] ? b.min.x : b.max.x, h.sg[1] ? b.min.y : b.max.y, h.sg[2] ? b.min.z : b.max.z);
    const P = planeHit(r, cp); if (!P) return; const dv = cp.clone().sub(an), den = dv.dot(dv); if (den < 1e-9) return;
    const sc = Math.max(0.01, P.clone().sub(an).dot(dv) / den);
    M = new M4x().makeTranslation(an.x, an.y, an.z).multiply(new M4x().makeScale(sc, sc, sc)).multiply(new M4x().makeTranslation(-an.x, -an.y, -an.z));
  } else {
    const P = planeHit(r, c); if (!P) return; const dl = P.sub(c); M = new M4x().makeTranslation(dl.x, dl.y, dl.z);
  }
  xformApply(M, d.aff); TS.A = M.clone().multiply(d.A0); refreshSelPositions(); buildFree(); chRefresh();
}
addEventListener("pointermove", e => { if (fdrag) freeMove(e); });
addEventListener("pointerup", () => { if (!fdrag) return; const aff = fdrag.aff; fdrag = null; orbit.enabled = true; xformEnd(aff); });
</script>
