<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anim Viewer</title>
<style>
  :root {
    --bg: #1b1d21; --panel: #24272c; --panel2: #2c3036; --line: #3a3f46;
    --text: #e6e8eb; --muted: #9aa1ab; --accent: #f0a23b; --accent2: #4fb3d9; --key: #e5534b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-rows: auto 1fr auto; }
  header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .title { font-weight: 600; margin-right: 6px; }
  header .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  button, select { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--muted); }
  button.on { background: var(--accent); color: #1b1d21; border-color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr minmax(260px, 36%); min-height: 0; }
  main.norefs { grid-template-columns: 1fr; }
  main.norefs #refpane { display: none; }
  #viewport { position: relative; min-height: 0; }
  #viewport canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 10px; top: 8px; color: var(--muted); pointer-events: none;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
  #hud b { color: var(--text); }
  #help { position: absolute; right: 10px; bottom: 8px; color: var(--muted); font-size: 11px; pointer-events: none;
    text-align: right; text-shadow: 0 1px 2px #000; }
  #refpane { display: flex; flex-direction: column; border-left: 1px solid var(--line); background: #111316; min-height: 0; }
  #refbar { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #refbar label { color: var(--muted); display: flex; gap: 4px; align-items: center; }
  #refwrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #refwrap video { max-width: 100%; max-height: 100%; }
  footer { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 10px; align-items: center;
    padding: 8px 10px; background: var(--panel); border-top: 1px solid var(--line); }
  #timeline { position: relative; height: 26px; }
  #timeline input { position: absolute; inset: 0; width: 100%; margin: 0; accent-color: var(--accent); }
  #marks { position: absolute; left: 8px; right: 8px; top: 0; height: 6px; pointer-events: none; }
  #marks i { position: absolute; top: 0; width: 2px; height: 6px; background: var(--key); transform: translateX(-1px); }
  #frame { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted);
    text-align: center; padding: 20px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; }
    #refpane { border-left: 0; border-top: 1px solid var(--line); }
    footer { grid-template-columns: auto auto 1fr auto; }
    footer .speed { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">Anim Viewer</span>
    <select id="job" title="Clip"></select>
    <span class="sep"></span>
    <button data-cam="front" title="Phím 1">Front</button>
    <button data-cam="back" title="Phím 2">Back</button>
    <button data-cam="left" title="Phím 3">Left</button>
    <button data-cam="right" title="Phím 4">Right</button>
    <button data-cam="top" title="Phím 5">Top</button>
    <button data-cam="persp" title="Phím 0">3/4</button>
    <span class="sep"></span>
    <button id="ortho" title="O">Ortho</button>
    <button id="skel" title="S">Skeleton</button>
    <button id="wire" title="W">Wire</button>
    <button id="grid" class="on" title="G">Grid</button>
    <button id="follow" title="F: camera follows the root">Follow</button>
    <button id="overlay" title="V: model over the reference, through the calibrated camera">Overlay</button>
  </header>
  <main id="main">
    <div id="viewport"><div id="hud"></div><div id="help">Chuột trái: xoay · phải: pan · lăn: zoom<br>Space: play · ←/→: frame · ,/.: key trước/sau · 0–5: góc cam · V: overlay</div><div id="msg">Đang tải…</div></div>
    <div id="refpane">
      <div id="refbar">
        <select id="refview"></select>
        <label><input type="checkbox" id="reffollow" checked> theo góc cam</label>
        <label title="Độ đục của model trong chế độ Overlay">model <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="0.5" style="width:70px"></label>
      </div>
      <div id="refwrap"><video id="ref" muted playsinline preload="auto"></video></div>
    </div>
  </main>
  <footer>
    <button id="play" title="Space">▶</button>
    <span>
      <button id="prevkey" title=",">⟨key</button>
      <button id="nextkey" title=".">key⟩</button>
    </span>
    <div id="timeline"><input id="scrub" type="range" min="1" max="1" value="1" step="1"><div id="marks"></div></div>
    <span id="frame">1 / 1</span>
    <select id="speed" class="speed" title="Tốc độ">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="2">2×</option>
    </select>
  </footer>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ROOT = new URL("../../", location.href);       // project root (server root)

// ---------------------------------------------------------------- scene
const vp = $("viewport");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
vp.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2d32);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3530, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
scene.add(sun);
const grid = new THREE.GridHelper(10, 10, 0x6b7280, 0x41464e);
scene.add(grid);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.35 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const persp = new THREE.PerspectiveCamera(35, 1, 0.01, 200);
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 200);
let camera = persp;
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
let height = 2, target = new THREE.Vector3(0, 1, 0);

function resize() {
  const w = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h, false);
  persp.aspect = w / h; persp.updateProjectionMatrix();
  layoutOverlay();
  const half = height * 0.95;
  Object.assign(ortho, { left: -half * w / h, right: half * w / h, top: half, bottom: -half });
  ortho.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(vp);

// glTF is Y-up; a Blender character facing -Y faces +Z here, its left is +X.
const CAMS = {
  front: [0, 0, 1], back: [0, 0, -1], left: [1, 0, 0], right: [-1, 0, 0],
  top: [0, 1, 0.0001], persp: [0.7, 0.35, 1],
};
let currentCam = "persp";
let overlayOn = false, overlayView = null, saved = null;
const calCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 500);
let refTex = null;

function setMeshOpacity(op) {
  model?.traverse((o) => {
    if (o.isMesh) [].concat(o.material).forEach((m) => { m.transparent = op < 1; m.opacity = op; m.needsUpdate = true; });
  });
}

function useRefBackground() {
  refTex?.dispose();
  const v = $("ref");
  refTex = new THREE.VideoTexture(v);
  refTex.colorSpace = THREE.SRGBColorSpace;
  scene.background = refTex;
  // VideoTexture only uploads on a new video frame: nudge a paused video so it presents one
  if (v.paused) v.currentTime = (frame - 1) / fps + 0.5 / fps + 1e-4;
}

// Model seen through the calibrated reference camera, with the reference video frame behind it.
function layoutOverlay() {
  if (!overlayOn) return;
  const c = job.cameras[overlayView];
  const w = vp.clientWidth, h = vp.clientHeight, A = w / h;
  const [x0, y0, x1, y1] = c.box || [0, 0, c.W, c.H];
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  let bw = x1 - x0, bh = y1 - y0;
  if (bw / bh < A) bw = bh * A; else bh = bw / A;
  const k = c.k;
  Object.assign(calCam, {
    left: (cx - bw / 2 - c.W / 2) * k, right: (cx + bw / 2 - c.W / 2) * k,
    top: (c.H / 2 - (cy - bh / 2)) * k, bottom: (c.H / 2 - (cy + bh / 2)) * k,
  });
  calCam.position.set(...c.pos);
  calCam.up.set(...c.up);
  calCam.lookAt(new THREE.Vector3(...c.pos).add(new THREE.Vector3(...c.dir)));
  calCam.updateProjectionMatrix();
  if (refTex) {
    refTex.repeat.set(bw / c.W, bh / c.H);
    refTex.offset.set((cx - bw / 2) / c.W, 1 - (cy + bh / 2) / c.H);
  }
}

function setOverlay(on) {
  const cams = job?.cameras || {};
  const view = refViews.includes($("refview").value) ? $("refview").value : refViews[0];
  if (on && !(view && cams[view])) { alert("Clip này chưa có camera hiệu chỉnh (chạy keyanim view sau khi dump)."); return; }
  overlayOn = on;
  $("overlay").classList.toggle("on", on);
  if (on) {
    overlayView = view;
    saved = saved || { bg: scene.background, grid: grid.visible };
    useRefBackground();
    grid.visible = false; floor.visible = false;
    if (skel) skel.visible = true;
    setMeshOpacity(+$("opacity").value);
    controls.enabled = false;
    layoutOverlay();
  } else if (saved) {
    scene.background = saved.bg; grid.visible = saved.grid; floor.visible = true;
    if (skel) skel.visible = $("skel").classList.contains("on");
    refTex?.dispose(); refTex = null; saved = null;
    setMeshOpacity(1);
    controls.enabled = true;
  }
}

function overlaySwitch(view) {
  if (!overlayOn || !job.cameras?.[view]) return;
  overlayView = view;
  useRefBackground();
  layoutOverlay();
}
function setCam(name) {
  currentCam = name;
  const d = new THREE.Vector3(...CAMS[name]).normalize();
  const dist = height * 3.2;
  camera.position.copy(target).addScaledVector(d, dist);
  ortho.zoom = 1;
  controls.target.copy(target);
  controls.update();
  document.querySelectorAll("[data-cam]").forEach((b) => b.classList.toggle("on", b.dataset.cam === name));
  if ($("reffollow").checked && refViews.includes(name)) { $("refview").value = name; loadRef(name); overlaySwitch(name); }
}
function setOrtho(on) {
  const pos = camera.position.clone();
  camera = on ? ortho : persp;
  camera.position.copy(pos);
  controls.object = camera;
  controls.update();
  $("ortho").classList.toggle("on", on);
}

// ---------------------------------------------------------------- state
let job = null, mixer = null, action = null, model = null, skel = null, rootBone = null;
let fps = 30, frames = 1, frame = 1, playing = false, keyFrames = [], refViews = [];
let acc = 0, follow = false;
const restRoot = new THREE.Vector3();

function setFrame(f, fromVideo = false) {
  frame = Math.min(frames, Math.max(1, f));
  const t = (frame - 1) / fps;
  if (action) { action.time = t; mixer.update(0); }
  $("scrub").value = Math.round(frame);
  $("frame").textContent = `${Math.round(frame)} / ${frames}`;
  const k = keyFrames.includes(Math.round(frame));
  $("hud").innerHTML = `<b>${job?.name ?? ""}</b> · ${job?.model ?? ""}<br>frame <b>${Math.round(frame)}</b>`
    + ` · ${t.toFixed(2)} s${k ? ' · <span style="color:var(--key)">KEY</span>' : ""}`;
  const v = $("ref");
  if (!fromVideo && v.src && (!playing || Math.abs(v.currentTime - t) > 0.15)) v.currentTime = t + 0.5 / fps;
}

function togglePlay(on = !playing) {
  playing = on;
  $("play").textContent = playing ? "❚❚" : "▶";
  const v = $("ref");
  if (!v.src) return;
  v.playbackRate = +$("speed").value;
  if (playing) { v.currentTime = (frame - 1) / fps; v.play().catch(() => {}); } else v.pause();
}

// ---------------------------------------------------------------- loading
async function loadJob(path) {
  $("msg").style.display = "flex";
  $("msg").textContent = "Đang tải…";
  togglePlay(false);
  const base = new URL(path.replace(/\/?$/, "/"), ROOT);
  try {
    job = await (await fetch(new URL("viewer.json", base))).json();
  } catch {
    $("msg").textContent = `Không đọc được ${path}/viewer.json. Chạy: python tools/keyanim.py view --work ${path}`;
    return;
  }
  fps = job.fps; frames = job.frame_count; keyFrames = job.keys || [];
  $("scrub").max = frames;
  $("marks").innerHTML = keyFrames.map((k) => `<i style="left:${((k - 1) / Math.max(1, frames - 1)) * 100}%"></i>`).join("");

  if (model) { scene.remove(model); scene.remove(skel); }
  const gltf = await new GLTFLoader().loadAsync(new URL(job.glb, base).href + `?t=${Date.now()}`);
  model = gltf.scene;
  model.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
    if (o.isBone && !rootBone && /root_m|hips|pelvis/i.test(o.name)) rootBone = o;
  });
  scene.add(model);
  skel = new THREE.SkeletonHelper(model);
  skel.visible = $("skel").classList.contains("on");
  scene.add(skel);
  mixer = new THREE.AnimationMixer(model);
  action = gltf.animations[0] ? mixer.clipAction(gltf.animations[0]) : null;
  if (action) { action.play(); action.paused = true; }

  setFrame(1);
  // character size from the skeleton (skinned-mesh bounds are unreliable, props skew them)
  model.updateMatrixWorld(true);
  let top = 0;
  const p = new THREE.Vector3();
  model.traverse((o) => {
    if (o.isBone && !/weapon|prop|ik|target|pole/i.test(o.name)) top = Math.max(top, o.getWorldPosition(p).y);
  });
  height = Math.max(0.5, top * 1.1);
  window.__viewer = { scene, model, get camera() { return camera; }, height };
  target.set(0, height * 0.55, 0);
  if (rootBone) rootBone.getWorldPosition(restRoot);
  resize();

  refViews = Object.keys(job.refs || {});
  $("main").classList.toggle("norefs", refViews.length === 0);
  $("refview").innerHTML = refViews.map((v) => `<option>${v}</option>`).join("");
  refBase = base;
  if (refViews.length) loadRef(refViews.includes(currentCam) ? currentCam : refViews[0]);
  setCam(params.get("cam") || (refViews.includes("front") ? "front" : "persp"));
  $("msg").style.display = "none";
  resize();
}

let refBase = null;
function loadRef(view) {
  const v = $("ref");
  const url = new URL(job.refs[view], refBase).href;
  if (v.src !== url) { v.src = url; v.addEventListener("loadeddata", () => setFrame(frame), { once: true }); }
  $("refview").value = view;
}

async function loadIndex() {
  const start = params.get("job");
  let jobs = [];
  try { jobs = (await (await fetch(new URL("work/index.json", ROOT))).json()).jobs.map((j) => `work/${j}`); } catch {}
  if (start && !jobs.includes(start)) jobs.unshift(start);
  $("job").innerHTML = jobs.map((j) => `<option value="${j}">${j.replace(/^work\//, "")}</option>`).join("");
  const first = start || jobs[0];
  if (!first) { $("msg").textContent = "Chưa có clip nào. Chạy: python tools/keyanim.py view --work work/<job>"; return; }
  $("job").value = first;
  loadJob(first);
}

// ---------------------------------------------------------------- ui
$("job").onchange = (e) => {
  const u = new URL(location.href); u.searchParams.set("job", e.target.value); history.replaceState(null, "", u);
  rootBone = null; loadJob(e.target.value);
};
document.querySelectorAll("[data-cam]").forEach((b) => (b.onclick = () => setCam(b.dataset.cam)));
$("ortho").onclick = () => setOrtho(camera !== ortho);
$("skel").onclick = (e) => { e.target.classList.toggle("on"); if (skel) skel.visible = e.target.classList.contains("on"); };
$("wire").onclick = (e) => {
  const on = e.target.classList.toggle("on");
  model?.traverse((o) => { if (o.isMesh) [].concat(o.material).forEach((m) => (m.wireframe = on)); });
};
$("grid").onclick = (e) => { grid.visible = e.target.classList.toggle("on"); };
$("follow").onclick = (e) => { follow = e.target.classList.toggle("on"); };
$("overlay").onclick = () => setOverlay(!overlayOn);
$("opacity").oninput = (e) => { if (overlayOn) setMeshOpacity(+e.target.value); };
$("play").onclick = () => togglePlay();
$("scrub").oninput = (e) => { togglePlay(false); setFrame(+e.target.value); };
$("speed").onchange = (e) => { $("ref").playbackRate = +e.target.value; };
$("refview").onchange = (e) => { $("reffollow").checked = false; loadRef(e.target.value); overlaySwitch(e.target.value); };
const jumpKey = (dir) => {
  const f = Math.round(frame);
  const k = dir > 0 ? keyFrames.find((x) => x > f) : [...keyFrames].reverse().find((x) => x < f);
  if (k) { togglePlay(false); setFrame(k); }
};
$("prevkey").onclick = () => jumpKey(-1);
$("nextkey").onclick = () => jumpKey(1);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "ArrowRight") { togglePlay(false); setFrame(Math.round(frame) + 1); }
  else if (k === "ArrowLeft") { togglePlay(false); setFrame(Math.round(frame) - 1); }
  else if (k === "Home") setFrame(1);
  else if (k === "End") setFrame(frames);
  else if (k === ",") jumpKey(-1);
  else if (k === ".") jumpKey(1);
  else if ("012345".includes(k)) setCam(["persp", "front", "back", "left", "right", "top"][+k]);
  else if (k === "o" || k === "O") setOrtho(camera !== ortho);
  else if (k === "s" || k === "S") $("skel").click();
  else if (k === "w" || k === "W") $("wire").click();
  else if (k === "g" || k === "G") $("grid").click();
  else if (k === "f" || k === "F") $("follow").click();
  else if (k === "v" || k === "V") $("overlay").click();
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (playing && action) {
    acc += dt * fps * +$("speed").value;
    let f = frame + acc; acc = 0;
    // loop clips: the last frame duplicates the first, so wrap before it (no 1-frame hold)
    const end = job?.loop ? frames - 1 : frames;
    if (f > end + 0.999) { f = 1 + (f - end - 1); const v = $("ref"); if (v.src) v.currentTime = (f - 1) / fps; }
    setFrame(f);
  }
  if (follow && rootBone) {
    rootBone.getWorldPosition(tmp);
    const d = new THREE.Vector3(tmp.x - restRoot.x, 0, tmp.z - restRoot.z);
    const want = new THREE.Vector3(0, height * 0.55, 0).add(d);
    camera.position.add(want.clone().sub(controls.target));
    controls.target.copy(want);
  }
  controls.update();
  renderer.render(scene, overlayOn ? calCam : camera);
});

resize();
loadIndex();
</script>
</body>
</html>
