[project]
name = "horuschat-mcp"
version = "0.1.0"
description = "MCP server for HorusChat (Matrix gateway Developer API): rooms, history, events, send, thread, edit, react"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
horuschat-mcp = "horuschat_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horuschat_mcp"]
