<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Quy trình Rigging 3D với AI</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--light:#F6F3EE;--dark:#13203A;--ink:#16223A;--gold:#F0B13B;--goldtxt:#8A5208;--good:#2E7D5B;--bad:#C2492E;--mute:#4C5568;--card:#EDE6D8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Be Vietnam Pro',Arial,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center}
section{position:absolute;inset:0;display:none;padding:100px 128px 140px;flex-direction:column;gap:30px;background:var(--light);color:var(--ink)}
section.on{display:flex}
section.dark{background:var(--dark);color:#fff}
.kick{font-size:24px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--goldtxt)}
.dark .kick{color:var(--gold)}
h1{font-size:96px;font-weight:800;line-height:1.05}
h2{font-size:56px;font-weight:700;line-height:1.1}
p,li{font-size:28px;line-height:1.35}
.row{display:flex;gap:26px}
.card{flex:1;background:var(--card);border-radius:18px;padding:28px 32px;display:flex;flex-direction:column;gap:10px}
.dark .card{background:#1D3554}
.card h3{font-size:32px;font-weight:700}
.card p,.card li{font-size:25px}
.card ul{padding-left:26px;display:flex;flex-direction:column;gap:6px}
.err{background:#fff;border-left:10px solid var(--bad)}
.dark .err{background:#2a2f45;border-left-color:#E5603F}
.err .lab{font-size:21px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--bad)}
.dark .err .lab{color:#ff9a7e}
.fix{background:#fff;border-left:10px solid var(--good)}
.fix .lab{font-size:21px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--good)}
.tag{display:inline-block;font-size:22px;font-weight:700;padding:4px 14px;border-radius:999px;background:var(--gold);color:#13203A;width:max-content}
.big{font-size:72px;font-weight:800;color:var(--goldtxt);line-height:1;font-family:'JetBrains Mono',monospace}
.dark .big{color:var(--gold)}
.ok{color:var(--good)} .no{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:25px}
th,td{text-align:left;padding:14px 18px;border-bottom:2px solid #D9D0BE;vertical-align:top}
th{font-size:22px;color:var(--mute);font-weight:600}
.dark th{color:#9db0cc}.dark td{border-bottom-color:#2d4568}
tr.hl{background:var(--card)}
.dark tr.hl{background:#1D3554}
.flow{display:flex;align-items:stretch}
.step{flex:1;background:var(--card);padding:22px 18px;display:flex;flex-direction:column;gap:8px;clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,8% 50%);margin-right:-16px}
.step:first-child{clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%);padding-left:26px}
.step b{font-size:24px}
.step span{font-size:20px;color:var(--mute);line-height:1.3}
.step.gate{background:var(--gold)}
.step.gate span{color:#3a2a08}
.num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:var(--goldtxt)}
.pg{position:absolute;right:128px;bottom:52px;font-size:24px;color:var(--mute)}
.dark .pg{color:#9db0cc}
.note{position:absolute;left:128px;bottom:52px;width:1400px;font-size:23px;color:var(--mute)}
.dark .note{color:#9db0cc}
.split{display:flex;gap:28px;flex:1;min-height:0}
.col{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.col.w{flex:1.35}
.fig{margin:0;background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border:2px solid #D9D0BE}
.fig img{width:100%;display:block;object-fit:contain;max-height:470px;background:#fff}
.fig figcaption{padding:10px 16px;font-size:21px;line-height:1.3;color:var(--mute);border-top:2px solid #EFE9DC}
.fig figcaption b{color:var(--ink)}
.fig.sch figcaption::before{content:"SƠ ĐỒ MINH HOẠ · ";font-weight:700;color:var(--goldtxt)}
.fig.real figcaption::before{content:"ẢNH THẬT TRONG DỰ ÁN · ";font-weight:700;color:var(--good)}
.pair{display:flex;gap:18px}.pair .fig{flex:1}
.tall img{max-height:640px}
section>.card{flex:none}
.fig{flex-shrink:0}
b.n{font-family:'JetBrains Mono',monospace;color:var(--bad)}
#hint{position:fixed;left:12px;bottom:8px;color:#888;font:12px sans-serif;z-index:9}
@media print{html,body{overflow:visible;background:#fff}#stage{position:static;transform:none!important;width:auto;height:auto}section{position:relative;display:flex!important;width:1920px;height:1080px;page-break-after:always}}
@page{size:1920px 1080px;margin:0}
</style>
</head>
<body>
<div id="stage">
