</div>
<div id="hint">← → chuyển slide · F toàn màn hình · Ctrl+P ra PDF</div>
<script>
const S=[...document.querySelectorAll('section')],st=document.getElementById('stage');
S.forEach((s,j)=>{if(j>0){const p=document.createElement('span');p.className='pg';p.textContent=(j+1)+' / '+S.length;s.appendChild(p)}});
let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1));
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='translate(-50%,-50%) scale('+k+')'}
function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,j)=>s.classList.toggle('on',j===i));location.hash=i+1}
addEventListener('resize',fit);fit();show(i);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key))show(i+1);
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key))show(i-1);
  else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
addEventListener('click',e=>show(e.clientX>innerWidth/2?i+1:i-1));
</script>
</body>
</html>
