[project]
name = "maya-mcp"
version = "0.1.0"
description = "MCP server for Autodesk Maya 2024 via a localhost listener inside Maya"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
maya-mcp = "maya_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maya_mcp"]
