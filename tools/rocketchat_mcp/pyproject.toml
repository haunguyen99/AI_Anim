[project]
name = "rocketchat-mcp"
version = "0.1.0"
description = "MCP server for Rocket.Chat: read, search, send messages and upload files via the REST API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
rocketchat-mcp = "rocketchat_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rocketchat_mcp"]
