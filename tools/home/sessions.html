<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phiên Claude</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#dfe3e8;--tx:#1d2330;--mut:#6b7482;--ac:#2f6df6;--ok:#1f9d55;--warn:#d98a00;--bad:#d03a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181e;--panel:#1d2129;--line:#2f3541;--tx:#e6e9ee;--mut:#8b94a3;--ac:#6c9bff;--ok:#44c27c;--warn:#f0b03a;--bad:#ef6a6a}}
:root[data-theme=dark]{--bg:#15181e;--panel:#1d2129;--line:#2f3541;--tx:#e6e9ee;--mut:#8b94a3;--ac:#6c9bff;--ok:#44c27c;--warn:#f0b03a;--bad:#ef6a6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}header a{color:var(--ac);text-decoration:none}.sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.bad{color:var(--bad)}button:disabled{opacity:.5;cursor:default}
main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:12px;padding:12px 16px;height:calc(100vh - 54px)}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;min-height:200px}
.row{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.row:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
.row.sel{background:color-mix(in srgb,var(--ac) 14%,transparent)}.row .t{display:flex;gap:8px;align-items:center}.row .n{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--mut);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}.d-chạy{background:var(--ok)}.d-xong{background:var(--ok)}.d-chờ{background:var(--ac)}.d-kẹt,.d-chặn{background:var(--warn)}.d-thoát,.d-gone{background:var(--bad)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--mut)}
.sec{padding:8px 12px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;background:var(--bg);border-bottom:1px solid var(--line)}
.det{padding:14px 16px}.det h2{margin:0 0 4px;font-size:17px}.meta{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.45 Consolas,monospace;margin:6px 0 14px}
h3{font-size:13px;margin:12px 0 0;color:var(--mut)}textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px}textarea{min-height:70px;resize:vertical}
.msg{padding:8px 12px;margin:8px 16px 0;border-radius:6px;background:color-mix(in srgb,var(--warn) 16%,transparent)}.hide{display:none}
.empty{padding:30px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<header><h1>Phiên Claude</h1><a href="/home">← Home</a><div class="sp"></div><span id="upd" class="tag"></span>
<button onclick="newForm()" class="pri">+ Giao việc mới</button><button onclick="load(true)">Làm mới</button></header>
<div id="msg" class="msg hide"></div>
<main>
  <div class="col" id="list"><div class="empty">Đang đọc…</div></div>
  <div class="col" id="det"><div class="empty">Chọn một phiên bên trái, hoặc bấm “Giao việc mới”.</div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const ST={"chạy":"Đang chạy","chờ":"Chờ (xong lượt)","kẹt":"Kẹt: chờ duyệt quyền","xong":"Xong","chặn":"Chặn: cần bạn trả lời","dừng":"Đã dừng","thoát":"Thoát, chưa có báo cáo",gone:"Đã xoá"};
let rows=[],sel=null,timer=null,formOpen=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function stOf(r){if(r.sub)return r.sub.status;const s=r.state;return s==="blocked"?"kẹt":(s==="idle"||s==="done")?"chờ":"chạy"}
function ago(ms){if(!ms)return"";const m=Math.round((Date.now()-ms)/60000);return m<1?"vừa xong":m<60?m+" phút trước":m<1440?Math.round(m/60)+" giờ trước":Math.round(m/1440)+" ngày trước"}
function flash(t){const e=$("msg");e.textContent=t;e.classList.remove("hide");clearTimeout(flash.t);flash.t=setTimeout(()=>e.classList.add("hide"),6000)}
async function api(p,body){const r=await fetch(p,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});return r.json()}
function rowHtml(r,depth){const s=stOf(r);return `<div class="row ${sel===r.id?"sel":""}" style="padding-left:${12+depth*16}px" onclick="pick('${r.id}')">
<div class="t"><span class="dot d-${s}"></span><span class="n">${esc(r.name)}</span><span class="tag">${r.sub?"phiên con":r.kind==="interactive"?"đang mở":"nền"}</span></div>
<div class="s">${ST[s]||s} · ${ago(r.started)}${r.sub&&r.sub.report?" · "+esc(r.sub.report):""}</div></div>`}
function render(){
  const subs=rows.filter(r=>r.sub),others=rows.filter(r=>!r.sub&&r.live!==false);
  const byKey={};subs.forEach(r=>byKey[r.sub.key]=r);
  let h="";
  const tree=(par,d)=>subs.filter(r=>(r.sub.parent||null)===par).map(r=>rowHtml(r,d)+tree(r.sub.key,d+1)).join("");
  const roots=subs.filter(r=>!r.sub.parent||!byKey[r.sub.parent]);
  h+=`<div class="sec">Phiên con (${subs.length})</div>`+(subs.length?roots.map(r=>rowHtml(r,0)+tree(r.sub.key,1)).join(""):`<div class="empty">Chưa có phiên con.</div>`);
  h+=`<div class="sec">Phiên khác (${others.length})</div>`+others.map(r=>rowHtml(r,0)).join("");
  $("list").innerHTML=h;
}
async function load(manual){
  try{const d=await api("/api/sessions/list");if(!d.ok)throw d.error;rows=d.rows;$("upd").textContent="cập nhật "+new Date().toLocaleTimeString("vi-VN");
    if(!d.claude)flash("Không thấy lệnh claude trên máy: chưa quản lý được phiên.");render();if(sel&&!formOpen)showDet(false)}
  catch(e){$("upd").textContent="lỗi";if(manual)flash("Không đọc được: "+e)}
}
function pick(id){sel=id;formOpen=false;render();showDet(true)}
async function showDet(scroll){
  const r=rows.find(x=>x.id===sel);if(!r){$("det").innerHTML=`<div class="empty">Phiên không còn.</div>`;return}
  const s=stOf(r),d=await api("/api/sessions/detail?id="+r.id);if(formOpen||sel!==r.id)return;
  const subOk=!!r.sub, live=["chạy","chờ","kẹt"].includes(s);
  $("det").innerHTML=`<div class="det"><h2>${esc(r.name)}</h2>
<div class="meta">${ST[s]||s} · id ${r.id} · ${esc(r.cwd||"")} · ${ago(r.started)}${r.sub&&r.sub.queued?" · "+r.sub.queued+" tin đang xếp hàng":""}</div>
<div class="act">${subOk?`<button onclick="sendForm()">Nhắn thêm</button>${live?`<button class="bad" onclick="act('stop')">Dừng</button>`:""}<button class="bad" onclick="act('rm')">Xoá</button>`:`<span class="tag">Phiên này chỉ xem: mở trong VS Code / app, không do phiên con giao</span>`}</div>
<div id="extra"></div>
${d.report?`<h3>Báo cáo</h3><pre>${esc(d.report)}</pre>`:""}
${d.brief?`<h3>Việc đã giao</h3><pre>${esc(d.brief.split("\n---\nLUẬT PHIÊN CON")[0])}</pre>`:""}
${d.log?`<h3>Log gần nhất</h3><pre id="logbox">${esc(d.log)}</pre>`:`<h3>Log</h3><div class="meta">Phiên mở trong VS Code / app không có log nền.</div>`}</div>`;
  const lb=$("logbox");if(lb)lb.scrollTop=lb.scrollHeight;
}
function sendForm(){formOpen=true;$("extra").innerHTML=`<h3>Nhắn thêm</h3><textarea id="m" placeholder="Việc thêm hoặc câu trả lời cho phiên con…"></textarea><div class="act"><button class="pri" onclick="doSend()">Gửi</button><button onclick="formOpen=false;showDet()">Huỷ</button></div>`;$("m").focus()}
async function doSend(){const m=$("m").value.trim();if(!m)return;const d=await api("/api/sessions/send",{id:sel,message:m});formOpen=false;flash(d.ok?"Đã gửi. "+(d.text||""):"Lỗi: "+d.error);load()}
async function act(op){if(!confirm(op==="rm"?"Xoá phiên này (mất hội thoại)?":"Dừng phiên này? Hội thoại vẫn giữ."))return;
  const d=await api("/api/sessions/"+op,{id:sel});flash(d.ok?"Xong.":"Lỗi: "+d.error);if(op==="rm"){sel=null;$("det").innerHTML=""}load()}
function newForm(){sel=null;formOpen=true;render();$("det").innerHTML=`<div class="det"><h2>Giao việc cho phiên con</h2>
<div class="meta">Phiên nền chạy ngay trong thư mục dự án, tự báo cáo khi xong. Chỉ đọc/sửa file, không dùng MCP (Frolvy, Maya…), không commit.</div>
<h3>Tên ngắn</h3><input id="nn" placeholder="vd: doc-bao-cao">
<h3>Việc cần làm (file nào được sửa, “xong” là gì)</h3><textarea id="nb" style="min-height:140px"></textarea>
<h3>Cho phép thêm lệnh (tuỳ chọn, ngăn bằng dấu ;)</h3><input id="na" placeholder='vd: Bash(git status*)'>
<div class="act"><button class="pri" onclick="doStart()">Giao việc</button><button onclick="formOpen=false;$('det').innerHTML=''">Huỷ</button></div></div>`;$("nn").focus()}
async function doStart(){const name=$("nn").value.trim(),brief=$("nb").value.trim();if(!name||!brief){flash("Cần tên và nội dung việc.");return}
  const d=await api("/api/sessions/start",{name,brief,allow:$("na").value.trim()||null});formOpen=false;
  if(d.ok){flash("Đã giao việc.");$("det").innerHTML=""}else flash("Lỗi: "+d.error);load()}
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
load();timer=setInterval(()=>{if(!document.hidden&&!formOpen)load()},4000);
</script>
</body>
</html>
