[project]
name = "spine-mcp"
version = "0.1.0"
description = "MCP server for Spine 2D: Spine CLI + skeleton JSON editing"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
spine-mcp = "spine_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spine_mcp"]
